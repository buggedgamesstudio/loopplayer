let currentLang = (() => {
  try { const saved = localStorage.getItem('lp_language'); if (saved && I18N[saved]) return saved; } catch(e){}
  return 'en'; // default language is always English until the user picks one
})();
function t(key, vars){
  const dict = I18N[currentLang] || I18N.en;
  let s = (key in dict) ? dict[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
// Updates only this element's own direct text node(s), leaving any nested
// child elements intact (e.g. the little "i" tip-button living inside a
// label span) instead of clobbering them with a blind textContent write.
function setI18nText(el, text){
  for (const n of el.childNodes){
    if (n.nodeType === Node.TEXT_NODE){ n.textContent = text; return; }
  }
  el.insertBefore(document.createTextNode(text), el.firstChild);
}
function localizeError(res){
  if (!res) return '';
  const ERROR_MSG = {
    no_file_loaded:'errNoFileLoaded', file_not_found:'errFileNotFound',
    invalid_slot:'errInvalidSlot', track_not_found:'errTrackNotFound',
    window_not_ready:'errWindowNotReady', missing_soundfile:'errMissingSoundfile',
    missing_sounddevice:'errMissingSounddevice',
  };
  if (res.error_code && ERROR_MSG[res.error_code]) return t(ERROR_MSG[res.error_code], res.error_data || {});
  return t('statusErrorPrefix', {msg: res.error || ''});
}
// Re-applies translated text to the already-built knob/EQ cells without
// rebuilding them (rebuilding would reset every slider back to default).
function retranslateKnobs(){
  $('knobGrid').querySelectorAll('.knobcell').forEach((cell, i) => {
    const k = KNOBS[i]; const nm = cell.querySelector('.nm'); const tip = cell.querySelector('.tipbtn');
    if (nm) setI18nText(nm, t(k.nameKey));
    if (tip) tip.dataset.tip = t(k.tipKey);
  });
}
function retranslateEq(){
  $('eqGrid').querySelectorAll('.eqcell').forEach((cell, i) => {
    const tip = cell.querySelector('.tipbtn'); if (tip) tip.dataset.tip = t(EQ_BANDS[i].tipKey);
  });
}
function applyI18n(){
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    if (el.id === 'lblFile' || el.id === 'statusbar') return;
    setI18nText(el, t(el.dataset.i18n));
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-tip]').forEach(el => { el.dataset.tip = t(el.dataset.i18nTip); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  retranslateKnobs(); retranslateEq();

    $('lblBadge').textContent = t('badgeLoop', {start: fmtTime(loopStart), end: fmtTime(loopEnd)});

}

function fmtTime(s){
  if (s == null || s < 0) s = 0;
  const m = Math.floor(s/60), sec = s % 60;
  return `${m}:${sec.toFixed(2).padStart(5,'0')}`;
}

// ── Timecode widget: min / sec / ms, drag up/down or click to type ──
function makeTC(id){
  const orig=$(id); orig.style.display='none';
  const box=document.createElement('div'); box.className='tc';
  const max=[99,59,99], w=[2,2,2], sep=[':','.'], step=[1,1,1], ins=[];
  for(let i=0;i<3;i++){
    const el=document.createElement('input'); el.type='text'; el.inputMode='numeric'; el.maxLength=w[i];
    el.value='0'.repeat(w[i]); ins.push(el);
    const fix=()=>{ let v=parseInt(el.value.replace(/\D/g,''))||0; el.value=String(Math.min(v,max[i])).padStart(w[i],'0'); };
    el.addEventListener('blur',fix);
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){fix(); el.blur();} });
    let y0=null, v0=0, moved=false;
    el.addEventListener('pointerdown',e=>{
      if(document.activeElement===el) return;
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      y0=e.clientY; v0=parseInt(el.value)||0; moved=false;
    });
    el.addEventListener('pointermove',e=>{
      if(y0===null) return;
      const dy=y0-e.clientY;
      if(Math.abs(dy)>3) moved=true;
      if(moved) el.value=String(Math.max(0,Math.min(max[i],v0+Math.round(dy/3)*step[i]))).padStart(w[i],'0');
    });
    el.addEventListener('pointerup',()=>{ if(y0===null) return; y0=null; if(!moved){el.focus(); el.select();} });
    box.appendChild(el);
    if(i<2){ const t=document.createElement('i'); t.textContent=sep[i]; box.appendChild(t); }
  }
  orig.parentNode.appendChild(box);
  // existing code reads/writes orig.value ("m:ss.xx") — route it through the 3 fields
  Object.defineProperty(orig,'value',{
    get(){ return `${parseInt(ins[0].value)||0}:${ins[1].value}.${ins[2].value}`; },
    set(v){
      const p=String(v).split(':'), sec=p.length>1?(parseFloat(p[0])||0)*60+(parseFloat(p[1])||0):(parseFloat(p[0])||0);
      const t=Math.round(sec*100), m=Math.min(Math.floor(t/6000),99);
      ins[0].value=String(m).padStart(2,'0');
      ins[1].value=String(Math.floor(t%6000/100)).padStart(2,'0'); ins[2].value=String(t%100).padStart(2,'0');
    }
  });
  orig.value='0:00';
}

/* ── snap ─────────────────────────────────────────────────────── */
// The step is a real, absolute unit of the knob's own value (percentage
// points for the %-based knobs, semitones for Pitch — see its
// `snapSteps` above), NOT a fraction of the slider's pixel/range width.
// Most knobs just use the shared SNAP_STEPS ladder as-is; a knob can
// override it with its own `snapSteps` array when its unit is a
// different scale (e.g. Pitch).
function snapValue(v, lo, hi, steps){
  const arr = steps || SNAP_STEPS;
  const step = arr[snapIdx];
  if (!step) return v;
  const nearest = Math.round(v / step) * step;
  return Math.max(lo, Math.min(hi, nearest));
}
function refreshSnapLabel(){
  $('snapVal').textContent = SNAP_STEPS[snapIdx] === 0 ? t('offLabel') : SNAP_STEPS[snapIdx];
}
$('snapDown').onclick = () => { snapIdx = Math.max(0, snapIdx-1); refreshSnapLabel(); };
$('snapUp').onclick   = () => { snapIdx = Math.min(SNAP_STEPS.length-1, snapIdx+1); refreshSnapLabel(); };

/* ── smooth "spring" reset animation ─────────────────────────────
   Used whenever a slider is reset to its default: eases quickly
   toward the target, drifts slightly past it, then settles back —
   not an instant jump, not a slow crawl. */
function easeOutBack(t){
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function animateSliderTo(input, valEl, target, lo, hi, formatFn, onFrame, onDone, duration = 380){
  const start = parseFloat(input.value);
  if (start === target){
    input.value = target;
    if (valEl) valEl.textContent = formatFn(target);
    if (onFrame) onFrame(target);
    if (onDone) onDone();
    return;
  }
  const t0 = performance.now();
  function step(now){
    const t = Math.min(1, (now - t0) / duration);
    // clamp every frame to the slider's own bounds — without this, the
    // overshoot on a knob whose default sits right at an edge (e.g.
    // Reverb/Drive/Comp resetting to 0) dips past that edge; the
    // <input> silently clamps its own displayed value but our label
    // kept following the un-clamped number, so the thumb looked stuck
    // for a few frames then jumped — the "jerky" stutter.
    const raw = start + (target - start) * easeOutBack(t);
    const v = Math.max(lo, Math.min(hi, raw));
    input.value = v;
    if (valEl) valEl.textContent = formatFn(v);
    if (onFrame) onFrame(v);
    if (t < 1){
      requestAnimationFrame(step);
    } else {
      input.value = target;
      if (valEl) valEl.textContent = formatFn(target);
      if (onFrame) onFrame(target);
      if (onDone) onDone();
    }
  }
  requestAnimationFrame(step);
}

/* ── easter egg: click the logo, the ring+arrow kicks forward a bit ─
   No spring-back: each click just nudges the angle further, so a CSS
   transition alone handles it smoothly — including a fast repeat
   click, which the browser blends into naturally since the transition
   just redirects toward the new target instead of restarting. */
(() => {
  const brand = document.querySelector('.brand');
  const kick = document.querySelector('.mk-kick');
  if (!brand || !kick) return;
  let angle = 0, shown = 0, raf = 0;
  const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  brand.addEventListener('click', () => {
    angle += 34;
    const from = shown, to = angle, t0 = performance.now();
    cancelAnimationFrame(raf);
    const step = (now) => {
      const x = Math.min(1, (now - t0) / 750);
      shown = from + (to - from) * easeOutBack(x);
      kick.setAttribute('transform', `rotate(${shown.toFixed(2)} 50 50)`);
      if (x < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  });
})();

/* ── build knob grid ──────────────────────────────────────────── */
const knobInputs = {};
function buildKnobs(){
  const grid = $('knobGrid');
  grid.innerHTML = '';
  KNOBS.forEach(k => {
    knobVals[k.key] = k.dv;
    const cell = document.createElement('div');
    cell.className = 'knobcell';
    cell.innerHTML = `
      <div class="knobhead"><span class="nm">${t(k.nameKey)}<span class="tipbtn" data-tip="${t(k.tipKey)}">i</span></span><span class="val" style="color:${k.col}; text-shadow:0 0 8px ${k.col}66">${dispVal(k, k.dv)}</span></div>
      <input type="range" min="${k.lo}" max="${k.hi}" value="${k.dv}" step="1" style="--knob-col:${k.col}">
    `;
    const input = cell.querySelector('input');
    const valEl = cell.querySelector('.val');
    input.addEventListener('input', () => {
      // snap live while dragging too, so the thumb jumps straight from
      // one snap step to the next (10/25/50/...) instead of crawling
      // through every single native unit first
      let v = snapValue(parseFloat(input.value), k.lo, k.hi, k.snapSteps);
      input.value = v;
      valEl.textContent = dispVal(k, v);
      knobVals[k.key] = v;
      api().set_knob(k.key, v);
    });
    input.addEventListener('change', () => {
      let v = snapValue(parseFloat(input.value), k.lo, k.hi, k.snapSteps);
      input.value = v;
      valEl.textContent = dispVal(k, v);
      knobVals[k.key] = v;
      api().set_knob(k.key, v);
      autosave();
    });
    // reset on double-click anywhere in this control's cell, not just on the
    // thin slider track/thumb itself — animates back with a little
    // spring/overshoot rather than jumping instantly
    cell.addEventListener('dblclick', () => {
      animateSliderTo(input, valEl, k.dv, k.lo, k.hi, v => dispVal(k, v),
        v => { knobVals[k.key] = v; api().set_knob(k.key, v); },
        () => autosave());
    });
    knobInputs[k.key] = {input, valEl};
    grid.appendChild(cell);
  });
}
function dispVal(k, v){
  v = Math.round(v);
  const sign = (k.key === 'pitch' && v > 0) ? '+' : '';

async function attemptClearSlot(i, el){

  // renderSlots() rebuilds the whole grid, which would cut the shake
  // animation short if it ran the instant the API call resolves — so
  // wait for the animation to finish too, whichever takes longer.
  const [res] = await Promise.all([
    api().clear_slot(i),

/* ── canvas drawing helpers (with neon glow) ─────────────────── */
function fitCanvas(cnv){
  const rect = cnv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (cnv.width !== w || cnv.height !== h){ cnv.width = w; cnv.height = h; }
  const ctx = cnv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w:rect.width, h:rect.height};
}

let vuShown = 0;
function drawVU(level, dt){
  const {ctx,w,h} = fitCanvas($('vu'));
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = COL.dim; ctx.fillRect(0,0,w,h);
  const target = Math.min(1.0, level*SENS_MULT[vuSensitivity]);
  // ease toward the latest reading every frame (not just every network tick)
  // so the bar glides instead of jumping whenever a new value arrives
  const rate = target > vuShown ? 0.55 : 0.15;
  vuShown += (target - vuShown) * Math.min(1, rate * (dt/16.7));
  const lvl = vuShown;
  const peakDecay = Math.pow(0.90, dt/16.7);
  vuPeak = Math.max(vuPeak*peakDecay, lvl);
  const nSegs = Math.min(w, 80);
  for (let k=0;k<nSegs;k++){
    const t = k/nSegs;
    if (t > lvl) break;
    const x0 = Math.floor(k/nSegs*w), x1 = Math.floor((k+1)/nSegs*w);
    let col;
    if (t < 0.7) col = blend(COL.acc_dim, COL.acc, t/0.7);
    else col = blend(COL.acc, '#ffffff', (t-0.7)/0.3);
    ctx.fillStyle = col;
    ctx.shadowColor = COL.acc; ctx.shadowBlur = glowPx(6);
    ctx.fillRect(x0,1,x1-x0,h-2);
  }
  ctx.shadowBlur = glowPx(0);
  const px = vuPeak*w;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = glowPx(5);
  ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,h); ctx.stroke();
  ctx.shadowBlur = glowPx(0);
}

function drawProgress(pos){
  const {ctx,w,h} = fitCanvas(progCanvas);
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = COL.bg2; ctx.fillRect(0,0,w,h);
  if (!duration){ return; }
  const frac = Math.min(1, pos/duration);
  const px = frac*w, cy = h/2;

  if (peaks.length){
    const n = peaks.length, barW = w/n;
    for (let i=0;i<n;i++){
      const x0 = i*barW, x1 = x0 + Math.max(1, barW-1);
      const bh = Math.max(1.5, peaks[i]*(h*0.42));
      const played = x0 <= px;
      ctx.fillStyle = played ? COL.acc : COL.bg3;
      if (played){ ctx.shadowColor = COL.acc; ctx.shadowBlur = glowPx(5); } else { ctx.shadowBlur = glowPx(0); }
      ctx.fillRect(x0, cy-bh, x1-x0, bh*2);
    }
    ctx.shadowBlur = glowPx(0);
  } else {
    ctx.fillStyle = COL.bg3; ctx.fillRect(0, cy-1, w, 2);
    ctx.fillStyle = COL.acc; ctx.fillRect(0, cy-1, px, 2);
  }

  if (loopStart != null && loopEnd != null){
    const x1 = (loopStart/duration)*w, x2 = (loopEnd/duration)*w;
    ctx.strokeStyle = COL.acc_hot; ctx.lineWidth = 2;
    ctx.shadowColor = COL.acc; ctx.shadowBlur = glowPx(8);
    ctx.beginPath(); ctx.moveTo(x1,0); ctx.lineTo(x1,h); ctx.stroke();
    ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(x2,0); ctx.lineTo(x2,h); ctx.stroke();
    ctx.setLineDash([]);
    ctx.shadowBlur = glowPx(0);
  }

  ctx.strokeStyle = COL.text; ctx.lineWidth = 1;
  ctx.shadowColor = COL.acc; ctx.shadowBlur = glowPx(10);
  ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,h); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(px, h-6, 5, 5, 0, 0, Math.PI*2);
  ctx.fillStyle = COL.text; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = COL.acc; ctx.stroke();
  ctx.shadowBlur = glowPx(0);
}

/* ── tick loop: poll the python side for playhead / VU / loop ──── */
let lastLevel = 0;
async function tick(){
  try{
    const t = await api().get_tick();
    if (duration || t.duration){
      duration = t.duration;
      $('lblPos').textContent = t.position_fmt;
      loopStart = t.loop_start; loopEnd = t.loop_end;
      drawProgress(t.position);
    }
    lastLevel = t.level;
    setPlayingUI(t.playing);
  } catch(e){ /* backend not ready yet */ }
  setTimeout(tick, 40);
}
/* redraw the VU meter every frame, independent of network-poll timing,
   so it moves smoothly even if a get_tick() round-trip is late/jittery */
let lastFrameT = performance.now();
function vuFrame(now){
  const dt = Math.min(64, now - lastFrameT);
  lastFrameT = now;
  drawVU(lastLevel, dt);
  requestAnimationFrame(vuFrame);
}
requestAnimationFrame(vuFrame);

/* ── tooltips: click the small "i" next to a control to see what it does ── */
(function(){
  const pop = $('tipPopover');
  let activeBtn = null;

  function hide(){
    pop.classList.remove('show');
    if (activeBtn) activeBtn.classList.remove('active');
    activeBtn = null;
    document.removeEventListener('mousemove', checkZone);
  }

  function position(btn){
    const r = btn.getBoundingClientRect();
    const pw = pop.offsetWidth || 220;
    let left = Math.min(window.innerWidth - pw - 10, Math.max(10, r.left + r.width/2 - pw/2));
    pop.style.left = left + 'px';
    // measure the *actual* rendered height (content is already set) instead of
    // assuming a fixed number, so long tips don't get pushed past the viewport
    // edge and clipped
    const ph = pop.offsetHeight;
    const below = r.bottom + 8;
    const fitsBelow = (below + ph + 10) <= window.innerHeight;
    let top = fitsBelow ? below : (r.top - ph - 8);
    top = Math.max(10, Math.min(top, window.innerHeight - ph - 10));
    pop.style.top = top + 'px';
  }

  // Instead of hiding the instant the cursor leaves the tiny "i" button,
  // keep the tooltip open while the cursor is anywhere inside the rectangle
  // spanning from the button to the popover (so moving diagonally into the
  // popover, or resting on it to read/select text, never closes it).
  function checkZone(e){
    if (!activeBtn) return;
    const br = activeBtn.getBoundingClientRect();
    const pr = pop.getBoundingClientRect();
    const pad = 8;
    const left = Math.min(br.left, pr.left) - pad;
    const right = Math.max(br.right, pr.right) + pad;
    const top = Math.min(br.top, pr.top) - pad;
    const bottom = Math.max(br.bottom, pr.bottom) + pad;
    if (e.clientX < left || e.clientX > right || e.clientY < top || e.clientY > bottom){
      hide();
    }
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.tipbtn');
    if (!btn){ hide(); return; }
    e.stopPropagation();
    if (btn === activeBtn){ hide(); return; }
    if (activeBtn) activeBtn.classList.remove('active');
    activeBtn = btn;
    btn.classList.add('active');
    pop.textContent = btn.dataset.tip;
    position(btn);
    requestAnimationFrame(() => pop.classList.add('show'));
    document.addEventListener('mousemove', checkZone);
  });
  window.addEventListener('resize', hide);
  window.addEventListener('scroll', hide, true);
})();

/* ── drag & drop zone ─────────────────────────────────────────── */
(function(){
  const zone = $('dropZone');
  const AUDIO_EXTS = ['mp3','wav','ogg','flac','m4a','aac'];

  function extOf(name){
    if (!name) return '';
    const m = /\.([a-z0-9]+)$/i.exec(name);
    return m ? m[1].toLowerCase() : '';
  }
  // Best-effort during dragenter/dragover: some webviews expose the
  // dragged file's name before drop, some only expose a generic
  // "Files" type. If we can't tell yet, don't guess — stay neutral
  // (plain "drag" highlight) until the actual drop.
  function draggedName(e){
    const dt = e.dataTransfer;
    if (!dt) return null;
    if (dt.files && dt.files[0] && dt.files[0].name) return dt.files[0].name;
    if (dt.items && dt.items[0]){
      const it = dt.items[0];
      if (it.kind === 'file' && it.type){
        // no filename available yet, but a non-audio MIME type is still a signal
        return it.type.startsWith('audio/') ? null : `unknown.${it.type.split('/')[1] || ''}`;
      }
    }
    return null;
  }
  function setHighlight(state){
    // state: 'drag' | 'bad' | null
    zone.classList.toggle('drag', state === 'drag');
    zone.classList.toggle('bad', state === 'bad');
  }
  function flashBad(msg){
    zone.classList.remove('shake'); void zone.offsetWidth; zone.classList.add('shake');
    status(msg);
  }

  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation();
    const name = draggedName(e);
    if (name){
      const ext = extOf(name);
      setHighlight(ext && AUDIO_EXTS.includes(ext) ? 'drag' : 'bad');
    } else {
      setHighlight('drag');
    }
  }));
  ['dragleave','dragend'].forEach(ev => zone.addEventListener(ev, (e) => {
    e.preventDefault(); setHighlight(null);
  }));
  zone.addEventListener('drop', async (e) => {
    e.preventDefault();
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f){ setHighlight(null); flashBad(t('dropErrorRead')); return; }
    const path = f.path || window.pvRegister(f); // browser: register the File, pywebview: real path
    const ext = extOf(f.name || path || '');
    if (!ext || !AUDIO_EXTS.includes(ext)){
      setHighlight(null);
      flashBad(t('dropErrorFormat', {ext: ext || '?'}));
      return;
    }
    if (!path){ setHighlight(null); flashBad(t('dropErrorPath')); return; }
    const res = await api().load_file(path);
    if (!res.ok){
      setHighlight(null);
      flashBad(t('dropErrorCorrupt', {name: f.name || path}));
      return;
    }
    setHighlight(null);
    status(t('statusSavingFile', {name: res.name}));
  });
  // stop a drop anywhere else in the window from navigating the app away
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => e.preventDefault());
})();

/* ── settings panel ───────────────────────────────────────────── */
(function(){
  const panel = $('settingsPanel'), overlay = $('settingsOverlay');
  function open(){ overlay.style.right = panel.offsetWidth + 'px'; panel.classList.add('show'); overlay.classList.add('show'); document.body.classList.add('settings-open'); }
  function close(){ panel.classList.remove('show'); overlay.classList.remove('show'); document.body.classList.remove('settings-open'); }
  $('btnSettings').addEventListener('click', open);
  $('settingsClose').addEventListener('click', close);
  // message bar (bottom status line): on by default, the choice is remembered
  const sbBtn = $('sbToggle');
  function setStatusBar(on){
    document.body.classList.toggle('no-statusbar', !on);
    sbBtn.classList.toggle('on', on);
    sbBtn.setAttribute('aria-checked', on ? 'true' : 'false');
    try { localStorage.setItem('lp_statusbar', on ? '1' : '0'); } catch(e){}
  }
  let sbSaved = '1'; try { sbSaved = localStorage.getItem('lp_statusbar') || '1'; } catch(e){}
  setStatusBar(sbSaved !== '0');
  sbBtn.addEventListener('click', () => setStatusBar(document.body.classList.contains('no-statusbar')));
  overlay.addEventListener('click', close);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
})();

/* ── language switcher ───────────────────────────────────────────
   Static markup translates immediately on load (before pywebview is
   even ready) so there's no flash of English; picking a new language
   just re-runs the same pass plus the dynamic bits (knob/EQ tips,
   slot labels, current Play/Pause and Mute/Unmute wording, etc). */
(function(){
  const btn = $('langSelectBtn'), label = $('langSelectLabel'), panel = $('langOptions');
  const LANG_NAMES = {en:'English', ru:'\u0420\u0443\u0441\u0441\u043a\u0438\u0439', uk:'\u0423\u043a\u0440\u0430\u0457\u043d\u0441\u044c\u043a\u0430', es:'Espa\u00f1ol', pl:'Polski', de:'Deutsch', fr:'Fran\u00e7ais'};
  // Each language is listed by its own native name, not translated into
  // whichever language is currently active — that's how every real
  // language picker does it, so this never needs to re-render on applyI18n().
  function renderSelected(){
    label.textContent = LANG_NAMES[currentLang] || currentLang;
    panel.querySelectorAll('.lang-option').forEach(o => o.classList.toggle('selected', o.dataset.value === currentLang));
  }
  function openPanel(){ panel.classList.add('show'); btn.setAttribute('aria-expanded','true'); document.addEventListener('click', onDocClick); }
  function closePanel(){ panel.classList.remove('show'); btn.setAttribute('aria-expanded','false'); document.removeEventListener('click', onDocClick); }
  function onDocClick(e){ if (!e.target.closest('#langSelect')) closePanel(); }
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    panel.classList.contains('show') ? closePanel() : openPanel();
  });
  panel.querySelectorAll('.lang-option').forEach(opt => {
    opt.addEventListener('click', () => {
      currentLang = opt.dataset.value;
      try { localStorage.setItem('lp_language', currentLang); } catch(e){}
      renderSelected();
      closePanel();
      applyI18n();
    });
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });
  renderSelected();
})();
applyI18n();

const THEME_STYLE = {'Paper-Ink':'paper', 'Paper-Sepia':'paper', 'Paper-Moss':'paper', 'Paper-Dusk':'paper',   'Liquid Dark-Red':'liquid', 'Liquid Dark-Blue':'liquid', 'Liquid Dark-Violet':'liquid', 'Liquid Light-Red':'liquid', 'Liquid Light-Blue':'liquid', 'Liquid Light-Violet':'liquid','Aesthetic-Coral':'plum', 'Aesthetic-Gold':'plum', 'Aesthetic-Mint':'plum', 'Aesthetic-Lilac':'plum', 'Aesthetic-Peach':'plum', 'Aesthetic-Rose':'plum', 'Aesthetic-Sky':'plum', 'Aesthetic-Sage':'plum', 'Aesthetic-Aqua':'plum', 'Geometric-Dark Red':'geo', 'Geometric-Light Red':'geo', 'Geometric-Dark Yellow':'geo', 'Geometric-Dark Green':'geo', 'Geometric-Dark Blue':'geo', 'Geometric-Light Yellow':'geo', 'Geometric-Light Green':'geo', 'Geometric-Light Blue':'geo', 'Liquid Dark-Ember':'liquid', 'Liquid Light-Ember':'liquid', 'Liquid Dark-Lime':'liquid', 'Liquid Dark-Gold':'liquid', 'Liquid Dark-Silver':'liquid', 'Liquid Dark-Teal':'liquid', 'Liquid Dark-Magenta':'liquid', 'Liquid Light-Lime':'liquid', 'Liquid Light-Gold':'liquid', 'Liquid Light-Silver':'liquid', 'Liquid Light-Teal':'liquid', 'Liquid Light-Magenta':'liquid'};

function hexRgb(h){ return [1,3,5].map(i => parseInt(h.slice(i, i+2), 16)).join(','); }
function hexArr(h){ return [1,3,5].map(i => parseInt(h.slice(i, i+2), 16)); }
function arrHex(a){ return '#' + a.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join(''); }
function mixPalette(a, b, t){
  // walk every key of both palettes: a key missing on one side (e.g. dot/hot) would make hexArr throw
  // mid-animation and leave the reboot overlay stuck with busy=true
  const out = {};
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) {
    const av = a[k] !== undefined ? a[k] : b[k], bv = b[k] !== undefined ? b[k] : a[k];
    const x = hexArr(av), y = hexArr(bv);
    out[k] = arrHex(x.map((v,i) => v + (y[i]-v)*t));
  }
  return out;
}

// CSS vars are written only when their value actually changes, so a
// palette step that doesn't touch a variable costs nothing in the browser.
const _lastVar = {};
function setVar(name, v){

// knob/EQ tints are JS getters over ACC; pushing them to the DOM is only

    const c = KNOBS[i].col, input = cell.querySelector('input'), val = cell.querySelector('.val');
    if (input) input.style.setProperty('--knob-col', c);
    if (val) { val.style.color = c; val.style.textShadow = `0 0 8px ${c}66`; }
  });
  document.querySelectorAll('#eqGrid .eqcell').forEach((cell, i) => {
    const c = EQ_BANDS[i].col, input = cell.querySelector('input'), val = cell.querySelector('.val');
    if (input) input.style.setProperty('--knob-col', c);
    if (val) { val.style.color = c; val.style.textShadow = `0 0 8px ${c}66`; }
  });
}

// set one full palette: CSS vars + the JS palette the canvases read
function applyPalette(p, full){
  ACC = p.acc; ACC2 = p.acc2 || p.acc;
  const UI = p.ui || ACC;                      // interface accent (buttons, bars, text glow); droplets/lamp keep ACC
  const accHot = p.hot || blend(UI, '#ffffff', 0.55);
  COL = { bg2: p.bg2, bg3: p.bg3, dim: p.bg3, text: p.text, muted: p.muted,
          acc: UI, acc_hot: accHot, acc_dim: blend(UI, '#000000', 0.35) };
  setVar('--acc', UI);
  setVar('--acc-hot', accHot);
  setVar('--acc-dim', COL.acc_dim);
  setVar('--acc2', p.acc2 || ACC);
  setVar('--acc-rgb', hexRgb(UI));
  setVar('--glass-rgb', hexRgb(p.glass));
  setVar('--panel-rgb', hexRgb(p.panel));
  setVar('--bg', p.bg);
  setVar('--bg2', p.bg2);
  setVar('--bg3', p.bg3);
  setVar('--text', p.text);
  setVar('--muted', p.muted);
  setVar('--bg-glow1', p.glow1);
  setVar('--bg-glow2', p.glow2);
  if (full) refreshAccentDom();
}

const RB_GEO_PAL = ['#FF3333','#FFDD5C','#38B6FF','#00BE63'];
const RB_GEO_SH = [

  '<circle cx="36" cy="50" r="28"/><circle cx="64" cy="50" r="28"/><circle cx="50" cy="36" r="28"/><circle cx="50" cy="64" r="28"/>',

function buildRebootGeo(){
  const host = $('rbGeo'); if (!host) return;
  const W = innerWidth, H = innerHeight, n = Math.max(6, Math.round(2 * (W + H) / 420));
  let html = '';
  for (let i = 0; i < n; i++){
    // spots spread around the screen edge, like the theme's background
    let t = (i + Math.random()) / n * 2 * (W + H), x, y;
    if (t < W) { x = t; y = 0; } else if ((t -= W) < H) { x = W; y = t; } else if ((t -= H) < W) { x = W - t; y = H; } else { x = 0; y = H - (t - W); }
    const size = 90 + Math.pow(Math.random(), 1.4) * 200;
    const c = RB_GEO_PAL[Math.floor(Math.random() * RB_GEO_PAL.length)];
    const sh = RB_GEO_SH[Math.floor(Math.random() * RB_GEO_SH.length)];
    const r = () => (Math.random() * 40 - 20).toFixed(1);
    html += `<div class="geo-s" style="left:${(x - size/2).toFixed(0)}px;top:${(y - size/2).toFixed(0)}px;width:${size.toFixed(0)}px;height:${size.toFixed(0)}px"><svg viewBox="0 0 100 100" style="--r0:${r()}deg;--r1:${r()}deg;--dx:${(Math.random()*30-15).toFixed(0)}px;--dy:${(Math.random()*30-15).toFixed(0)}px;--dur:${(12+Math.random()*14).toFixed(1)}s;--del:${(-Math.random()*12).toFixed(1)}s;fill:${c}">${sh}</svg></div>`;
  }
  host.innerHTML = html;
}

function themeWithReboot(name){
  if (themeRebootBusy || name === currentTheme || !THEMES[name]) return;
  themeRebootBusy = true;
  const from = THEMES[currentTheme], to = THEMES[name];
  const ov = $('rebootOverlay'), linesEl = $('rebootLines'), fill = $('rebootFill'),
        lbl = $('rebootLabel'), pct = $('rbPct'), nm = $('rbName');
  const LOG = ['rebootInit', 'rebootPalette', 'rebootApply', 'rebootRedraw'];
  const DUR_FILL = 2300, COLOR_AT = 250, COLOR_DUR = 2100, FADE_AT = 2600, TOTAL = 3100;
  const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
  const clamp = x => Math.max(0, Math.min(1, x));

  // the reboot screen takes the look of the TARGET type (neon / plum / geo / liquid).
  // body keeps a neutral style during the reboot so no type rules leak into the overlay.
  const type = THEME_STYLE[name] || 'glass';
  const isGeo = type === 'geo';
  const isLightGeo = isGeo && /Light/.test(name);
  ov.dataset.rb = isGeo ? (isLightGeo ? 'geo-light' : 'geo-dark') : 'simple';   // colours still morph
  if (isGeo) buildRebootGeo();
  document.body.dataset.style = 'glass';

  nm.textContent = name;
  nm.classList.remove('glitch'); void nm.offsetWidth; nm.classList.add('glitch');
  linesEl.textContent = ''; fill.style.width = '0%'; pct.textContent = '0%'; ov.style.setProperty('--p', '0');
  lbl.textContent = t('rebootTitle', { name });
  ov.classList.remove('fade-out'); ov.classList.add('show', 'fade-in');
  document.body.classList.add('rb-active');

  const t0 = performance.now();
  let logged = 0, lastPct = -1, doneShown = false, fading = false, lastColor = -1e9;
  function frame(now){
    const el = now - t0;
    const f = ease(clamp(el / DUR_FILL));
    fill.style.width = (f * 100).toFixed(2) + '%';
    ov.style.setProperty('--p', f.toFixed(3));
    const p = Math.round(f * 100);
    if (p !== lastPct) { pct.textContent = p + '%'; lastPct = p; }
    if (el >= TOTAL || now - lastColor >= 33) {          // colours morph from the old theme to the new one
      lastColor = now;
      try { applyPalette(mixPalette(from, to, ease(clamp((el - COLOR_AT) / COLOR_DUR))), false); } catch (err) { console.error(err); }
    }
    while (logged < LOG.length && el >= 180 + logged * 420) {
      linesEl.textContent += (logged ? '\n' : '') + t(LOG[logged]);
      logged++;
    }
    if (!doneShown && el >= DUR_FILL) { doneShown = true; lbl.textContent = t('rebootDone'); }
    if (!fading && el >= FADE_AT) { fading = true; ov.classList.add('fade-out'); }
    if (el < TOTAL) { requestAnimationFrame(frame); return; }
    applyTheme(name);                                   // the app's own style/tone/palette, applied as the overlay goes
    renderThemeSelected();
    ov.classList.remove('show', 'fade-in', 'fade-out');
    document.body.classList.remove('rb-active');
    themeRebootBusy = false;
  }
  requestAnimationFrame(frame);
}

async function init(){

  try{ await selectSlot(selectedSlot); } catch(e){ /* backend not ready */ }
}
if (window.pywebview) init();
else window.addEventListener('pywebviewready', init);

    const pad = Math.max(40, sb ? sb.offsetHeight : 0);   // keep bottom shapes above the panel

    field.style.height = L + 'px';
    field.innerHTML = '';
    const placed = [];
    // colour for a new shape: never the same as an overlapping shape
    const pick = r => {
      const free = PAL.filter(c => !placed.some(p => p.c === c && overlap(p.r, r)));
      const list = free.length ? free : PAL;
      return list[Math.floor(rnd() * list.length)];
    };
    const per = 2 * (W + L);
    const n = Math.max(6, Math.round(per / 420));        // spots spaced evenly along the perimeter
    for (let i = 0; i < n; i++){
      let t = (i + rnd()) / n * per, x, y, horiz;
      if (t < W) { x = t; y = 0; horiz = true; }
      else if ((t -= W) < L) { x = W; y = t; horiz = false; }
      else if ((t -= L) < W) { x = W - t; y = L; horiz = true; }
      else { t -= W; x = 0; y = L - t; horiz = false; }
      const count = rnd() < 0.5 ? 2 : 1;                  // at most 2 shapes per spot
      const main = 80 + Math.pow(rnd(), 1.4) * 200;
      for (let k = 0; k < count; k++){
        const size = k ? main * (0.5 + rnd() * 0.3) : main;
        let cx = x, cy = y;
        if (k){                                           // second shape slides along the same line
          const off = (rnd() < 0.5 ? -1 : 1) * main * 0.55;
          if (horiz) cx += off; else cy += off;
        }
        // centre stays on the perimeter line; only clamped along it
        if (horiz) cx = Math.max(0, Math.min(W, cx)); else cy = Math.max(0, Math.min(L, cy));
        const r = { x0: cx - size/2, y0: cy - size/2, x1: cx + size/2, y1: cy + size/2 };
        const c = pick(r);
        placed.push({ c, r });
        const wrap = document.createElement('div');
        wrap.className = 'geo-s';
        wrap.style.cssText = `left:${r.x0.toFixed(0)}px;top:${r.y0.toFixed(0)}px;width:${size.toFixed(0)}px;height:${size.toFixed(0)}px`;
        wrap.innerHTML = `<svg viewBox="0 0 100 100" style="--r0:${(rnd()*40-20).toFixed(1)}deg;--r1:${(rnd()*40-20).toFixed(1)}deg;--dx:${(rnd()*30-15).toFixed(0)}px;--dy:${(rnd()*30-15).toFixed(0)}px;--dur:${(12+rnd()*14).toFixed(1)}s;--del:${(-rnd()*12).toFixed(1)}s;fill:${c}">${SH[Math.floor(rnd()*SH.length)]}</svg>`;
        field.appendChild(wrap);
      }
    }
  }

  let tm; window.addEventListener('resize', () => { clearTimeout(tm); tm = setTimeout(() => build(false), 200); });
  new MutationObserver(() => { if (document.body.dataset.style === 'geo') build(true); })
    .observe(document.body, { attributes: true, attributeFilter: ['data-style'] });

  function frame(){
    if (document.body.dataset.style === 'geo'){
      const sc = document.body.scrollTop || document.documentElement.scrollTop;
      field.style.transform = `translate3d(0,${(-sc * D).toFixed(1)}px,0)`;
    }
    requestAnimationFrame(frame);
  }
  build(true);
  requestAnimationFrame(frame);
})();

<script>
/* Liquid-Dark Ember / Liquid-Light Ember background + liquid-glass UI.
   1) Lava lamp: wax blobs of different size, colour, shape and speed rise from a pool, stretch tails, merge, split and sink.
      Wax is shaded as translucent material (glowing thin edges, deep core, light from the lamp below, soft + sharp highlights).
   2) Dark liquid-glass blocks: the cards are drawn by the same shader as one signed-distance field, so their edges can swell,
      crawl and bud off droplets. The glass is translucent: the lamp shows through it, darkened, bent and slightly dispersed at the bevel.
   3) The status bar is its own floating glass capsule drawn above the cards, with its own shadow, warm rim and tint.
   Everything is rendered at native resolution; the resolution drops automatically on slow GPUs. */
(function(){
  const bg = document.querySelector('.bg-wrap');
  const cv = document.createElement('canvas');
  cv.id = 'liquidBg';
  bg.prepend(cv);
  const gl = cv.getContext('webgl', {antialias:false, alpha:false}) || cv.getContext('experimental-webgl');
  if (!gl) return;                                    // no WebGL: the old plain liquid style stays

  // ── lava lamp blobs: own size, colour, lane, speed and ceiling ──
  const COL = [[1.00,0.23,0.10],[1.00,0.42,0.08],[1.00,0.55,0.12],[1.00,0.70,0.25],[0.92,0.15,0.12],[1.00,0.80,0.38]];
  const SPEC = [ // radius, lane (-1..1), period (s), phase, top (0..1), colour idx
    [0.30,  0.05,  96, 0.00, 0.62, 1], [0.24, -0.62,  78, 0.31, 0.78, 0], [0.21,  0.70,  88, 0.58, 0.70, 2],
    [0.17, -0.22,  64, 0.82, 0.92, 4], [0.15,  0.38,  71, 0.14, 0.86, 3], [0.13, -0.88,  58, 0.47, 0.96, 1],
    [0.11,  0.92,  66, 0.70, 0.90, 5], [0.095,-0.42,  52, 0.93, 1.00, 2], [0.085, 0.22,  47, 0.39, 1.00, 5],
    [0.07,  0.58,  43, 0.66, 0.98, 3], [0.065,-0.05,  39, 0.21, 1.00, 0]
  ];
  const N = SPEC.length, NC = 9, NK = 72, RAD = 20, PAR = 0.25;
  const VS = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
  const FS = `
  #ifdef GL_FRAGMENT_PRECISION_HIGH
  precision highp float;
  #else
  precision mediump float;
  #endif
  #define N ${N}
  #define NC ${NC}
  #define NK ${NK}
  #define NR 6
  #define RAD ${RAD}.0
  uniform vec2 uRes; uniform float uT, uPx, uOff, uH;
  uniform vec4 uB[N];      // lamp blobs: x, y, radius, stretch
  uniform vec3 uCol[N];    // lamp blob colour
  uniform float uNK;       // how many of uCir are in use
  uniform float uLight;    // 0: dark theme, 1: white theme
  uniform vec3 uAcc;       // accent colour of the current variation (0..1)
  uniform vec3 uAcc2;      // secondary accent
  uniform vec4 uRip[NR];   // ripples: x, y (css px), age (s), amplitude (px)
  uniform vec4 uCard[NC];  // glass blocks: x0, y0, x1, y1 (css px, y down)
  uniform vec3 uCir[NK];   // edge swellings + flying droplets: x, y, radius (css px)
  uniform vec4 uBar;       // status bar capsule: x0, y0, x1, y1 (css px)
  uniform vec3 uBump[3];   // swellings crawling on the top edge of the status bar

  float ripples(vec2 q){

    for (int i = 0; i < NR; i++){
      vec4 rp = uRip[i];
      if (rp.w > 0.0){
        float r = length(q - rp.xy);
        float x = r - 130.0 * rp.z;
        float pk = exp(-x * x / 1800.0) * sin(x * 0.17);
        float sp = exp(-r * r / 700.0) * exp(-rp.z * 2.2) * sin(rp.z * 13.0);
        s += 0.2 * rp.w * exp(-rp.z * 0.9) * (pk * exp(-r * 0.006) + 0.6 * sp);
      }
    }
    return s;
  }
  // the edge of a block is never perfectly still: slow waves run along it
  float wob(vec2 q, vec2 c, vec2 h, float seed){
    vec2 p = q - c;
    float tb = smoothstep(-0.2, 0.2, abs(p.y) / max(h.y, 1.0) - abs(p.x) / max(h.x, 1.0));   // 1 on top/bottom edges, 0 on the sides

      for (int i = 0; i < NK; i++){

  }
  float barField(vec2 q){
    vec2 c = (uBar.xy + uBar.zw) * 0.5, h = (uBar.zw - uBar.xy) * 0.5;
    float rb = min(RAD + 1.0, h.y);
    vec2 e = abs(q - c) - h + rb;
    float d = length(max(e, 0.0)) + min(max(e.x, e.y), 0.0) - rb;
    for (int i = 0; i < 3; i++){ vec3 b = uBump[i]; d = smin(d, length(q - b.xy) - b.z, 7.0); }

  // ───────────── lava lamp (world space, scrolls with parallax) ─────────────
  vec3 lamp(vec2 pv){
    vec2 p = pv + vec2(0.0, uOff);
    float px = 2.0 / uRes.y;

    float f = 0.0; vec2 g = vec2(0.0); vec3 cs = vec3(0.0); float cr = 0.0;
    for (int i = 0; i < N; i++){
      vec4 b = uB[i];
      float a = 2.0 - b.w;
      vec2 d = (p - b.xy) * vec2(a, b.w);
      float D = max(dot(d, d), 1e-4);
      float fi = b.z * b.z / D;
      f += fi;
      g += -2.0 * fi / D * vec2(a * d.x, b.w * d.y);
      cs += uCol[i] * fi;
      cr += b.z * fi;
    }
    float hh = -0.90 + 0.030*sin(p.x*2.3 + uT*0.25) + 0.022*sin(p.x*5.1 - uT*0.40) + 0.014*sin(p.x*9.0 + uT*0.60);
    float t = clamp((p.y - hh + 0.06) / 0.40, 0.0, 1.0);
    float pf = 1.8 * (1.0 - t*t*(3.0 - 2.0*t));
    g.y += -1.8 * 6.0*t*(1.0 - t) / 0.40;
    f += pf;
    cs += uAcc * 0.92 * pf;
    cr += 0.40 * pf;
    vec3 wc = cs / max(f, 1e-3);

    float w = max(length(g) * px * 0.8, 0.002);
    float body = smoothstep(1.0 - w, 1.0 + w, f);

    // every blob is shaded as a smooth dome: no ridge in the middle
    float R = cr / max(f, 1e-3);
    float z = sqrt(max(1.0 - 1.0 / max(f, 1.0), 0.004));
    vec2 gz = g / (2.0 * f * f * z) * R;
    vec3 n = normalize(vec3(-gz, 1.0));
    vec3 L = normalize(vec3(-0.45, 0.65, 0.65));
    float diff = dot(n, L) * 0.5 + 0.5;
    float spec = pow(max(dot(n, normalize(L + vec3(0.0, 0.0, 1.0))), 0.0), 30.0);
    float rim  = pow(1.0 - n.z, 2.4);
    vec3 wax = mix(wc * 0.62, wc * 1.10 + uAcc * 0.20, pow(z, 0.8));
    wax *= 0.50 + 0.70 * diff;
    wax += rim * uAcc * 0.38;
    wax += spec * mix(vec3(1.0), uAcc, 0.35) * 0.36;
    wax += uAcc * 0.40 * smoothstep(0.1, -1.0, p.y) * 0.35;

    float hy = clamp((p.y + 1.0) / max(uH, 2.0), 0.0, 1.0);
    bool lt = uLight > 0.5;
    vec3 bgc = lt ? mix(vec3(0.925, 0.928, 0.935), mix(vec3(1.0), uAcc, 0.55), pow(1.0 - hy, 1.7) * 0.85)
                  : mix(vec3(0.022, 0.022, 0.024), uAcc * 0.34, pow(1.0 - hy, 1.7));
    float halo = pow(clamp(f, 0.0, 1.0), 2.4) * (1.0 - body) * 0.30;
    vec3 col = lt ? mix(bgc, mix(vec3(1.0), uAcc, 0.7), clamp(halo * 1.6, 0.0, 0.6)) : bgc + halo * uAcc;
    col = mix(col, wax, body);

  }

  // ───────────── dark liquid glass ─────────────
  // d: signed distance (css px), gr: outward direction, base: lamp straight behind this pixel,
  // dark: how much of the background shows through, amb: glass body tint, k: refraction strength (css px)
  vec3 glassAt(vec2 pv, float d, vec2 gr, vec3 base, float dark, vec3 amb, float k){
    float s = clamp(-d / 8.0, 0.0, 1.0);                           // 0 at the edge, 1 after 8px
    float bev = 1.0 - s;
    float zs = sqrt(max(1.0 - (1.0 - s) * (1.0 - s), 0.0025));
    vec3 nn = normalize(vec3(gr * (bev / zs), 1.0));               // rounded bevel
    vec3 bgc = base;

      vec2 o = vec2(gr.x, -gr.y) * (bev * bev * k) * (2.0 * uPx / uRes.y);
      bgc = vec3(lamp(pv - o * 0.80).r, lamp(pv - o).g, lamp(pv - o * 1.25).b);
    }

    vec3 g = lt ? mix(bgc, amb, dark) : bgc * dark + amb;      // white theme: dark = how opaque the white glass is
    vec3 Lc = normalize(vec3(-0.45, -0.65, 0.60));
    float sp = pow(max(dot(nn, normalize(Lc + vec3(0.0, 0.0, 1.0))), 0.0), 36.0);
    float sheen = pow(max(dot(nn, Lc), 0.0), 3.0);
    float lampL = pow(max(dot(nn, normalize(vec3(0.15, 0.9, 0.35))), 0.0), 3.0);   // warm light from the lamp below
    float fr = pow(1.0 - nn.z, 3.0);
    if (lt){
      float back = pow(max(dot(nn, normalize(vec3(0.45, 0.65, 0.60))), 0.0), 2.0);
      g *= 1.0 - 0.13 * back * bev;                                              // far side of the bevel is a little shaded
      g *= 1.0 - 0.13 * smoothstep(0.26, 0.0, s);                                // thin darker outline so white glass reads on white
      g = mix(g, g * mix(vec3(1.0), uAcc, 0.25), lampL * bev * 0.55);                 // warm lamp light from below tints the bevel
      g += sp * 0.30 + sheen * bev * 0.03;
      return g;
    }
    g += sp * vec3(0.95) * 0.75;
    g += sheen * bev * vec3(0.55) * 0.14;
    g += lampL * bev * uAcc * 0.34;
    g += fr * mix(vec3(0.9), uAcc, 0.5) * 0.10;
    g += smoothstep(0.22, 0.0, s) * uAcc * 0.55 * 0.28;               // fine edge line
    return g;
  }

  void main(){
    vec2 pv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y * 2.0;
    vec3 lamp0 = lamp(pv);
    vec3 col = lamp0;
    vec2 q = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uPx;
    float aa = 1.0 / uPx;
    float e = 1.0;
    bool lt = uLight > 0.5;

    // cards
    float d0 = field(q);
    if (d0 < 40.0) col *= lt ? 1.0 - vec3(0.15, 0.19, 0.23) * smoothstep(30.0, 0.0, d0) : vec3(1.0 - 0.42 * smoothstep(30.0, 0.0, d0));   // soft shadow so the glass separates from the lamp
    if (d0 < aa){
      vec2 gr = vec2(0.0);
      if (d0 > -10.0){ gr = vec2(field(q + vec2(e, 0.0)) - d0, field(q + vec2(0.0, e)) - d0); gr = gr / max(length(gr), 1e-4); }
      vec3 gc = lt ? glassAt(pv, d0, gr, lamp0, 0.68, vec3(1.0, 0.995, 0.985), 22.0) : glassAt(pv, d0, gr, lamp0, 0.17, vec3(0.016, 0.016, 0.018), 22.0);

    }

    float dB = barField(q);
    vec3 under = col;

    if (dB > 0.0 && dB < 16.0) col = lt ? mix(col, mix(vec3(1.0), uAcc, 0.6), 0.14 * smoothstep(16.0, 0.0, dB)) : col + uAcc * 0.10 * smoothstep(16.0, 0.0, dB);   // warm glow around it
    if (dB < aa){
      vec2 gr = vec2(0.0);
      if (dB > -10.0){ gr = vec2(barField(q + vec2(e, 0.0)) - dB, barField(q + vec2(0.0, e)) - dB); gr = gr / max(length(gr), 1e-4); }
      vec3 gb = lt ? glassAt(pv, dB, gr, under, 0.55, vec3(0.99, 0.99, 0.99), 26.0) : glassAt(pv, dB, gr, under, 0.30, vec3(0.030, 0.031, 0.034), 26.0);
      float rimB = smoothstep(1.8, 0.0, abs(dB + 0.6));
      gb = lt ? mix(gb, uAcc, rimB * 0.55) : gb + rimB * mix(vec3(1.0), uAcc, 0.4) * 0.45;   // warm rim
      col = mix(col, gb, smoothstep(aa, -aa, dB));
    }
    col += (hash(gl_FragCoord.xy + fract(uT)) - 0.5) / 255.0;
    gl_FragColor = vec4(col, 1.0);
  }`;
  const sh = (type, src) => {
    const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.warn('liquid shader:', gl.getShaderInfoLog(o));
    return o;
  };

  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)){ console.warn('liquid link:', gl.getProgramInfoLog(pr)); return; }
  gl.useProgram(pr);
  document.body.classList.add('liq-gl');                // the glass UI styles apply only when the shader works
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(pr, n);
  const uRes = U('uRes'), uT = U('uT'), uPx = U('uPx'), uOff = U('uOff'), uH = U('uH');

  const uB = U('uB'), uCol = U('uCol'), uCard = U('uCard'), uCir = U('uCir'), uBar = U('uBar'), uBump = U('uBump'), uNK = U('uNK'), uRip = U('uRip'), uLight = U('uLight');

  const B = new Float32Array(N * 4), C = new Float32Array(N * 3);

    const L = ACC === '#FF7A1A' ? COL : [ACC, blend(ACC,'#ffffff',0.25), ACC2, blend(ACC,'#000000',0.2), blend(ACC,'#ffffff',0.45), blend(ACC2,'#ffffff',0.3)].map(hexF);
    SPEC.forEach((s, i) => { C.set(L[s[5]], i * 3); });

  function updateLamp(t, asp, H){
    for (let i = 0; i < N; i++){
      const [r, lane, per, ph0, top] = SPEC[i];
      const ph = (ph0 + t / per) % 1;
      let k = 0.5 - 0.5 * Math.cos(ph * 6.28318);
      k = k * k * (3 - 2 * k);
      const speed = Math.abs(Math.sin(ph * 6.28318));
      const yTop = -1 + H * (0.12 + 0.80 * top);              // the lamp is as tall as the scrollable page
      const y = -1.02 + k * (yTop + 1.02);
      const x = lane * asp * 0.86 + 0.10 * Math.sin(t * 0.17 + i * 1.9) + 0.05 * Math.sin(t * 0.43 + i * 3.1) + 0.12 * Math.sin(ph * 6.28318 + i) * speed;
      const rr = r * (1 + 0.08 * Math.sin(t * 0.45 + i * 2.3));
      B[i*4] = x; B[i*4+1] = Math.min(y, -1 + H - 0.04 - rr * 0.6); B[i*4+2] = rr; B[i*4+3] = 1 - 0.26 * speed;
    }
  }

  // ── glass blocks: edge liquid of many different kinds ──
  //   crawlers  : slugs with a tail, tiny fast beads, big slow waves, twin droplets
  //   drips     : swell on the bottom edge, neck, tear off and fall onto the block below
  //   comets    : droplets that bud off an edge and fly to the block above, stretched along their path
  const FAR = -9999;
  const CARD = new Float32Array(NC * 4), CIR = new Float32Array(NK * 3), BUMP = new Float32Array(9);
  const ease = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const M = RAD + 14;                                         // swellings stay off the rounded corners
  const stateOf = new WeakMap();
  let els = [], elsT = -1e9, range = 0, drops = [], nextSpawn = 2.0, lastSc = 0, nc = 0;
  let simT = 0, curSc = 0;
  const rips = [], RIP = new Float32Array(6 * 4);
  function ripple(x, y, amp){ rips.push({ x, py: y + curSc, t: simT, amp }); if (rips.length > 14) rips.shift(); }
  const push = (x, y, r) => { if (nc < NK && r > 0.25){ CIR[nc*3] = x; CIR[nc*3+1] = y; CIR[nc*3+2] = r; nc++; } };

  function perimLen(r){
    const lx = Math.max(r.right - r.left - 2 * RAD, 0), ly = Math.max(r.bottom - r.top - 2 * RAD, 0);
    return 2 * (lx + ly) + 2 * Math.PI * RAD;
  }
  function perim(r, s){                                       // point + outward normal along the WHOLE outline, corners included
    const R = RAD, lx = Math.max(r.right - r.left - 2 * R, 0), ly = Math.max(r.bottom - r.top - 2 * R, 0), arc = Math.PI * R / 2;
    s = ((s % perimLen(r)) + perimLen(r)) % perimLen(r);
    const A = (cx, cy, th) => [cx + R * Math.cos(th), cy + R * Math.sin(th), Math.cos(th), Math.sin(th)];
    if (s < lx) return [r.left + R + s, r.top, 0, -1];
    s -= lx; if (s < arc) return A(r.right - R, r.top + R, -Math.PI / 2 + s / R);
    s -= arc; if (s < ly) return [r.right, r.top + R + s, 1, 0];
    s -= ly; if (s < arc) return A(r.right - R, r.bottom - R, s / R);
    s -= arc; if (s < lx) return [r.right - R - s, r.bottom, 0, 1];
    s -= lx; if (s < arc) return A(r.left + R, r.bottom - R, Math.PI / 2 + s / R);
    s -= arc; if (s < ly) return [r.left, r.bottom - R - s, -1, 0];
    s -= ly; return A(r.left + R, r.top + R, Math.PI + s / R);
  }
  function boxSdf(x, y, r){
    const cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2, hx = (r.right - r.left) / 2, hy = (r.bottom - r.top) / 2;
    const ex = Math.abs(x - cx) - hx + RAD, ey = Math.abs(y - cy) - hy + RAD;
    return Math.hypot(Math.max(ex, 0), Math.max(ey, 0)) + Math.min(Math.max(ex, ey), 0) - RAD;
  }

  // crawlers on the edge: each one has a type of its own
  function makeCrawler(type){
    const dir = Math.random() < .5 ? -1 : 1, c = { s: Math.random() * 2000, w: rnd(0.3, 0.9), ph: rnd(0, 6.3), tail: 0, lag: 0, type };
    if (type === 'slug'){  const r = rnd(7, 10.5); c.v = dir * rnd(14, 30); c.rmin = r * 0.8;  c.rmax = r * 1.3;  c.tail = rnd(0.55, 0.7); c.lag = rnd(1.7, 2.6); }
    if (type === 'bead'){  const r = rnd(2.4, 4.2); c.v = dir * rnd(28, 48); c.rmin = r * 0.85; c.rmax = r * 1.15; }
    if (type === 'wave'){  const r = rnd(14, 20);  c.v = dir * rnd(4, 9);    c.rmin = r * 0.5;  c.rmax = r * 1.15; c.w *= 0.6; }
    if (type === 'twin'){  const r = rnd(6.5, 9);  c.v = dir * rnd(8, 16);   c.rmin = r * 0.85; c.rmax = r * 1.15; c.tail = rnd(0.8, 1.0); c.lag = rnd(3.0, 3.8); }
    return c;
  }
  const crawlerR = (c, t) => c.rmin + (c.rmax - c.rmin) * (0.5 + 0.35 * Math.sin(t * c.w + c.ph) + 0.15 * Math.sin(t * c.w * 2.3 + c.ph * 1.7));
  function makeState(){
    const types = ['slug', 'bead', 'wave', 'twin', 'slug', 'bead'];
    const a = pick(types); let b = pick(types), c = pick(types);
    if (b === a) b = pick(types); if (c === a) c = pick(types);
    return { cr: [makeCrawler(a), makeCrawler(b), makeCrawler(c)], dr: newDrip(rnd(0.5, 6)), cool: 0 };
  }
  function newDrip(wait){ return { ph: 'wait', t: 0, wait, u: rnd(0.1, 0.9), R: rnd(5, 11), grow: rnd(4, 7.5), L: rnd(12, 30), y: 0, vy: 0, x: 0, hOff: 0 }; }

  // bar bumps keep a simple, but varied, form
  function makeBumps(){
    return [0, 1, 2].map(i => { const big = Math.random(); return { s: Math.random() * 2000, v: (Math.random() < .5 ? -1 : 1) * (8 + Math.random() * 30),
      rmin: (big < .3 ? 2.5 : 3.5) + Math.random() * 1.5, rmax: (big < .3 ? 5 : big < .7 ? 8.5 : 12) + Math.random() * 3, w: 0.35 + Math.random() * 0.5, ph: Math.random() * 6.3 }; });
  }
  const bumpR = (b, t) => b.rmin + (b.rmax - b.rmin) * (0.5 + 0.35 * Math.sin(t * b.w + b.ph) + 0.15 * Math.sin(t * b.w * 2.3 + b.ph * 1.7));

  function emitCrawlers(st, r, t, dt){
    if (st.cool > 0) st.cool -= dt;
    else {                                                    // two droplets run into each other: the edge splashes
      const P = perimLen(r);
      for (let i = 0; i < st.cr.length && !(st.cool > 0); i++) for (let j = i + 1; j < st.cr.length; j++){
        const a = st.cr[i], b = st.cr[j];
        let df = (((a.s - b.s) % P) + P) % P; if (df > P / 2) df -= P;       // shortest signed distance along the outline
        const ra = crawlerR(a, t), rb = crawlerR(b, t);
        if (Math.abs(df) < (ra + rb) * 0.95){
          const q = perim(r, b.s + df / 2);
          ripple(q[0], q[1], 0.7 + (ra + rb) * 0.06); st.cool = 2.2; break;
        }
      }
    }
    for (const c of st.cr){
      c.s += c.v * dt;
      const rr = crawlerR(c, t), q = perim(r, c.s);
      push(q[0] - q[2] * 0.1 * rr, q[1] - q[3] * 0.1 * rr, rr);
      if (c.tail > 0){                                        // tail lags behind the head, stretching with speed
        const k = 0.8 + 0.4 * Math.sin(t * c.w * 1.4 + c.ph), q2 = perim(r, c.s - Math.sign(c.v) * c.lag * rr * k);
        push(q2[0] - q2[2] * 0.1 * rr, q2[1] - q2[3] * 0.1 * rr, rr * c.tail);
      }
    }
  }
  function emitDrip(d, r, below, dt, dSc){                    // hangs from the bottom edge, falls onto the next block
    const x0 = r.left + M + d.u * Math.max(r.right - r.left - 2 * M, 1), yb = r.bottom;
    d.t += dt;
    if (d.ph === 'wait'){ if (d.t > d.wait){ d.ph = 'grow'; d.t = 0; } return; }
    if (d.ph === 'grow'){
      const k = Math.min(d.t / d.grow, 1), e1 = ease(k), e3 = k * k * k;
      const hr = d.R * (0.25 + 0.75 * e1), hOff = hr * 0.2 + e1 * d.L * 0.55 + e3 * d.L * 0.9;
      push(x0, yb + hOff, hr);                                // head
      push(x0, yb + hOff * 0.5, hr * 0.62 * (1 - 0.55 * e3)); // neck gets thinner as it stretches
      push(x0, yb - 1, hr * 0.9);                             // wet base
      d.x = x0; d.y = yb + hOff; d.hOff = hOff;
      if (k >= 1){ d.ph = 'fall'; d.t = 0; d.vy = 25; ripple(x0, yb, 0.7 + d.R * 0.08); }
      return;
    }
    if (d.ph === 'fall'){
      d.vy += 520 * dt; d.y += d.vy * dt - dSc; d.x = x0;
      const stretch = Math.min(d.vy * 0.05, d.R * 2.2);
      push(d.x, d.y, d.R);
      push(d.x, d.y - stretch, d.R * 0.55);                   // droplet is stretched along the fall
      if (d.t < 0.5) push(x0, yb + 2, d.R * 0.5 * (1 - d.t / 0.5));   // the neck snaps back into the edge
      // without a block below, the drop only stops at the message bar's height if the bar is shown; hidden bar = it falls off screen
      const noBar = document.body.classList.contains('no-statusbar');
      const maxFall = (below || !noBar) ? 150 : Infinity;
      if ((below && boxSdf(d.x, d.y, below) < d.R * 0.4) || d.y - yb > maxFall || d.y > innerHeight + 40){ d.ph = 'land'; d.t = 0; d.x1 = d.x; d.y1 = d.y; if (below) ripple(d.x, d.y, 0.9 + d.R * 0.15); }
      return;
    }
    const k = ease(d.t / 0.55);                               // landing: sinks into the block
    push(d.x1, d.y1 + k * 5, d.R * (1 - k));
    if (k >= 1) Object.assign(d, newDrip(rnd(2, 9)));
  }

  function spawn(rects, vh){
    const ok = [];
    for (let i = 1; i < rects.length; i++) if (rects[i] && rects[i].bottom > 60 && rects[i].top < vh - 60) ok.push(i);
    if (!ok.length) return;
    const i = pick(ok);
    let j = i - 1;
    if (i >= 2 && Math.random() < 0.3 && rects[i-2]) j = i - 2;
    if (!rects[j]) return;
    const r = 4 + 10 * Math.pow(Math.random(), 1.5);                   // many small ones, a few large
    drops.push({ src: i, tgt: j, side: Math.random() < 0.5 ? -1 : 1, u: 0.25 + Math.random() * 0.5, tu: 0.2 + Math.random() * 0.6,
      r, bud: 1.6 + r * 0.12, vmax: 175 - r * 5, st: 0, age: 0, x: 0, y: 0, vx: 0, vy: 0, ph: Math.random() * 6.3, rr: 0 });
  }
  function stepDrops(dt, rects, sc){
    const dSc = sc - lastSc; lastSc = sc;
    for (const d of drops){
      d.age += dt;
      const S = rects[d.src], T = rects[d.tgt];
      if (!S || !T){ d.dead = true; continue; }
      const ax = d.side < 0 ? S.left : S.right, ay = S.top + (S.bottom - S.top) * d.u;
      const tx = d.side < 0 ? T.left : T.right, ty = T.top + (T.bottom - T.top) * d.tu;
      if (d.st === 0){                                         // budding: swells out of the edge on a neck
        const k = ease(d.age / d.bud);
        d.rr = d.r * k;
        d.x = ax + d.side * (-0.3 * d.r + k * (1.3 * d.r + 5)); d.y = ay;
        push(d.x, d.y, d.rr);
        push((d.x + ax) / 2, ay, d.rr * 0.55 * (1 - 0.5 * k));
        if (d.age >= d.bud){ d.st = 1; d.age = 0; d.vx = d.side * 55; d.vy = -30; ripple(ax, ay, 0.6 + d.r * 0.1); }
      } else if (d.st === 1){                                  // flying toward the block above
        d.y -= dSc;
        const dx = tx - d.x, dy = ty - d.y;
        const ax2 = dx * 1.8 - d.vx * 2.6 + Math.sin(d.age * 1.7 + d.ph) * 5;
        const ay2 = dy * 1.8 - d.vy * 2.6 + Math.cos(d.age * 1.3 + d.ph) * 3 - 10;
        d.vx += ax2 * dt; d.vy += ay2 * dt;
        const sp = Math.hypot(d.vx, d.vy); if (sp > d.vmax){ d.vx *= d.vmax / sp; d.vy *= d.vmax / sp; }
        d.x += d.vx * dt; d.y += d.vy * dt;
        d.rr = d.r * (1 + 0.06 * Math.sin(d.age * 3 + d.ph));
        push(d.x, d.y, d.rr);                                  // comet: head + two tail pieces along the path
        const sp2 = Math.hypot(d.vx, d.vy), ux = sp2 > 1 ? -d.vx / sp2 : 0, uy = sp2 > 1 ? -d.vy / sp2 : 1, len = Math.min(sp2 / d.vmax, 1);
        push(d.x + ux * d.rr * (0.9 + 0.8 * len), d.y + uy * d.rr * (0.9 + 0.8 * len), d.rr * 0.66);
        push(d.x + ux * d.rr * (1.9 + 1.6 * len), d.y + uy * d.rr * (1.9 + 1.6 * len), d.rr * 0.38 * len);
        if (boxSdf(d.x, d.y, T) < d.r * 0.6 || d.age > 9){ const sp3 = Math.hypot(d.vx, d.vy) || 1; d.st = 2; d.age = 0; d.ux = -d.vx / sp3; d.uy = -d.vy / sp3; d.len = Math.min(sp3 / d.vmax, 1); ripple(d.x, d.y, 0.8 + d.r * 0.2); }
      } else {                                                 // landing: keeps its momentum, brakes, merges into the edge and is absorbed
        d.y -= dSc;
        const brake = Math.exp(-4 * dt);
        d.vx *= brake; d.vy *= brake;
        d.x += d.vx * dt; d.y += d.vy * dt;
        const k = Math.min(Math.max(d.age - 0.2, 0) / 0.7, 1), e = k * k * (3 - 2 * k), f = 1 - e;
        d.rr = d.r * f;
        push(d.x, d.y, d.rr);
        push(d.x + d.ux * d.r * (0.9 + 0.8 * d.len), d.y + d.uy * d.r * (0.9 + 0.8 * d.len), d.r * 0.66 * f);
        if (d.age >= 0.9) d.dead = true;
      }
    }
    drops = drops.filter(d => !d.dead);
  }

  let scale = Math.min(window.devicePixelRatio || 1, 1.5), frames = 0, acc = 0, last = 0, lastT = 0;
  function size(){
    cv.width  = Math.max(2, Math.round(innerWidth  * scale));
    cv.height = Math.max(2, Math.round(innerHeight * scale));
    gl.viewport(0, 0, cv.width, cv.height);
  }
  size();
  window.addEventListener('resize', size);
  const t0 = performance.now();

  function frame(now){
    if (document.body.dataset.style === 'liquid'){
      if (last){ acc += now - last; frames++; }
      last = now;
      if (frames >= 40){
        if (acc / frames > 30 && scale > 0.55){ scale *= 0.8; size(); }
        frames = 0; acc = 0;
      }
      const t = (now - t0) / 1000, dt = Math.min(0.05, t - lastT); lastT = t;
      const vw = innerWidth, vh = innerHeight;
      const sc = (document.scrollingElement || document.documentElement).scrollTop || document.body.scrollTop || 0;
      if (now - elsT > 400){
        els = Array.prototype.slice.call(document.querySelectorAll('.app > .card'), 0, NC);
        range = Math.max(0, document.documentElement.scrollHeight - vh, document.body.scrollHeight - vh);
        elsT = now;
      }
      // lamp: as tall as the page, scrolls at PAR speed
      const H = 2 * (vh + range * PAR) / vh;
      const off = Math.max(0, range - sc) * PAR * 2 / vh;
      updateLamp(t, cv.width / cv.height, H);

      simT = t; curSc = sc;
      // glass blocks
      CARD.fill(FAR); nc = 0;
      const rects = els.map(el => { const r = el.getBoundingClientRect(); return r.width > 4 && r.height > 4 ? r : null; });
      const dSc0 = sc - (frame.lastSc === undefined ? sc : frame.lastSc); frame.lastSc = sc;
      rects.forEach((r, i) => {
        if (!r) return;
        CARD.set([r.left, r.top, r.right, r.bottom], i * 4);
        let st = stateOf.get(els[i]); if (!st){ st = makeState(); stateOf.set(els[i], st); }
        if (r.bottom < -80 || r.top > vh + 80) return;                // off screen: nothing to animate
        emitCrawlers(st, r, t, dt);
        emitDrip(st.dr, r, rects[i + 1], dt, dSc0);
      });

      // status bar: its own capsule + swellings that crawl along its top edge
      const sb = document.getElementById('statusbar');
      let bar = [FAR, FAR, FAR, FAR];
      // unused bump slots must sit far away: a zero-radius blob at (0,0) bulged into the top-left corner
      for (let k = 0; k < 3; k++){ BUMP[k*3] = FAR; BUMP[k*3+1] = FAR; BUMP[k*3+2] = 0; }
      if (sb){
        const r = sb.getBoundingClientRect();
        bar = [r.left, r.top, r.right, r.bottom];
        let bs = stateOf.get(sb); if (!bs){ bs = { cr: [makeCrawler('bead'), makeCrawler('slug'), makeCrawler('wave')] }; stateOf.set(sb, bs); }
        const P = perimLen(r);
        bs.cr.forEach((c, k) => {
          c.s += c.v * dt * 0.8;
          const rr = crawlerR(c, t) * 0.7, q = perim(r, c.s);
          BUMP[k*3] = q[0] - q[2] * 0.1 * rr; BUMP[k*3+1] = q[1] - q[3] * 0.1 * rr; BUMP[k*3+2] = rr;
        });
      }

      // droplets: one at a time or two, never a crowd
      nextSpawn -= dt;
      if (nextSpawn <= 0 && drops.length < 4 && rects.length > 1){ spawn(rects, vh); nextSpawn = 1.8 + Math.random() * 3.5; }
      stepDrops(dt, rects, sc);

      gl.uniform2f(uRes, cv.width, cv.height);
      gl.uniform1f(uPx, cv.width / vw);
      gl.uniform1f(uT, t);
      gl.uniform1f(uOff, off);
      gl.uniform1f(uH, H);
      gl.uniform4fv(uB, B);
      lampRefresh();
      gl.uniform3fv(uCol, C);
      gl.uniform4fv(uCard, CARD);
      gl.uniform3fv(uCir, CIR);
      gl.uniform1f(uNK, nc);
      gl.uniform1f(uLight, document.body.dataset.tone === 'light' ? 1 : 0);
      { const a = hexF(ACC), a2 = hexF(ACC2); gl.uniform3f(uAcc, a[0], a[1], a[2]); gl.uniform3f(uAcc2, a2[0], a2[1], a2[2]); }
      RIP.fill(0);
      rips.slice(-6).forEach((rp, k) => { const age = t - rp.t; if (age < 4.5){ RIP[k*4] = rp.x; RIP[k*4+1] = rp.py - sc; RIP[k*4+2] = age; RIP[k*4+3] = rp.amp; } });
      gl.uniform4fv(uRip, RIP);
      gl.uniform4f(uBar, bar[0], bar[1], bar[2], bar[3]);
      gl.uniform3fv(uBump, BUMP);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    } else { last = 0; frames = 0; acc = 0; lastT = (now - t0) / 1000; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script><script>
/* paper: ruled lines slide with the page as you scroll (scroll happens on body here, so listen on capture) */
(function(){
  const bg = document.querySelector('.bg-wrap');
  function pageY(){ return (document.scrollingElement || document.documentElement).scrollTop || document.body.scrollTop || 0; }
  function update(){
    if (!bg) return;
    if (document.body.dataset.style === 'paper') bg.style.backgroundPosition = '0 ' + (-pageY() % 32) + 'px';
    else bg.style.backgroundPosition = '';
  }
  window.addEventListener('scroll', update, { capture: true, passive: true });
  new MutationObserver(update).observe(document.body, { attributes: true, attributeFilter: ['data-style'] });
  update();
})();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
