<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0b0d">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
/* Browser stand-in for the Python backend: window.pywebview.api implemented with Web Audio. */
(function(){
const SLOTS = 25, EQF = [60, 250, 1000, 4000, 16000];
const KDEF = {vol:100, rate:100, pitch:0, rev:0, dist:0, comp:0, pan:0, mute:0};
let ac = null, nodes = {}, buf = null, src = null, playing = false, off = 0, t0 = 0;
let kn = {...KDEF}, eqv = [0,0,0,0,0], loopS = null, loopE = null, sel = 0;
let mem = {}, reg = {}, regN = 0;
let prof = JSON.parse(localStorage.getItem('lp_profiles') || '[]');
const saveProf = () => { try { localStorage.setItem('lp_profiles', JSON.stringify(prof)); } catch(e){} };
const fmt = s => { s = Math.max(0, s || 0); return Math.floor(s/60) + ':' + (s % 60).toFixed(2).padStart(5,'0'); };
const parseT = s => { const p = String(s).split(':'); return p.length > 1 ? (+p[0])*60 + (+p[1] || 0) : (+s || 0); };

function irBuf(){
  const n = Math.floor(ac.sampleRate * 2.2), b = ac.createBuffer(2, n, ac.sampleRate);
  for (let c = 0; c < 2; c++){ const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 3); }
  return b;
}
function distCurve(a){
  const n = 1024, c = new Float32Array(n), k = a * 60;
  for (let i = 0; i < n; i++){ const x = i*2/n - 1; c[i] = k ? (3+k)*x*20*Math.PI/180 / (Math.PI + k*Math.abs(x)) : x; }
  return c;
}
function ensure(){
  if (ac) return ac;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const eq = EQF.map(f => { const b = ac.createBiquadFilter(); b.type = 'peaking'; b.frequency.value = f; b.Q.value = 1; return b; });
  eq.reduce((a, b) => (a.connect(b), b));
  const dist = ac.createWaveShaper(), comp = ac.createDynamicsCompressor(), conv = ac.createConvolver();
  conv.buffer = irBuf();
  const dry = ac.createGain(), wet = ac.createGain(), pan = ac.createStereoPanner(), gain = ac.createGain(), an = ac.createAnalyser();
  an.fftSize = 1024;
  eq[eq.length-1].connect(dist); dist.connect(comp);
  comp.connect(dry); comp.connect(conv); conv.connect(wet);
  dry.connect(pan); wet.connect(pan); pan.connect(gain); gain.connect(an); an.connect(ac.destination);
  nodes = {in: eq[0], eq, dist, comp, dry, wet, pan, gain, an};
  apply();
  return ac;
}
function apply(){
  if (!ac) return;
  const N = nodes;
  N.gain.gain.value = kn.mute ? 0 : kn.vol/100;
  N.pan.pan.value = Math.max(-1, Math.min(1, kn.pan/100));
  N.wet.gain.value = kn.rev/100 * 0.8;
  N.dry.gain.value = 1 - kn.rev/200;
  N.dist.curve = distCurve(kn.dist/100); N.dist.oversample = '4x';
  N.comp.threshold.value = -(kn.comp/100) * 40;
  N.comp.ratio.value = 1 + kn.comp/100 * 11;
  N.eq.forEach((b, i) => b.gain.value = eqv[i] || 0);
  if (src){ src.playbackRate.value = kn.rate/100; src.detune.value = kn.pitch*100; }
}
function pos(){
  if (!buf) return 0;
  if (!playing) return off;
  let p = off + (ac.currentTime - t0) * kn.rate/100;
  if (loopS != null && loopE > loopS && p > loopE) p = loopS + ((p - loopS) % (loopE - loopS));
  return Math.min(p, buf.duration);
}
function play(){
  if (!buf) return false;
  ensure(); if (ac.state === 'suspended') ac.resume();
  const s = ac.createBufferSource();
  s.buffer = buf; s.playbackRate.value = kn.rate/100; s.detune.value = kn.pitch*100;
  if (loopS != null && loopE > loopS){ s.loop = true; s.loopStart = loopS; s.loopEnd = loopE; }
  s.connect(nodes.in);
  s.onended = () => { if (src === s && playing && !s.loop){ playing = false; off = 0; src = null; } };
  s.start(0, off); src = s; t0 = ac.currentTime; playing = true;
  return true;
}
function stopSrc(){
  if (playing) off = pos();
  playing = false;
  if (src){ src.onended = null; try { src.stop(); } catch(e){} src.disconnect(); src = null; }
}
function restart(){ if (playing){ const p = pos(); stopSrc(); off = p; play(); } }
function level(){
  if (!nodes.an || !playing) return 0;
  const a = new Float32Array(nodes.an.fftSize); nodes.an.getFloatTimeDomainData(a);
  let s = 0; for (const x of a) s += x*x;
  return Math.min(1, Math.sqrt(s / a.length) * 4);
}
function peaksOf(b){
  const d = b.getChannelData(0), n = 200, step = Math.floor(d.length / n), out = []; let mx = 0;
  for (let i = 0; i < n; i++){ let m = 0; for (let j = i*step; j < (i+1)*step; j++){ const v = Math.abs(d[j]); if (v > m) m = v; } out.push(m); if (m > mx) mx = m; }
  return out.map(v => mx ? v/mx : 0);
}
function info(name, b){ return {ok:true, name, duration:b.duration, duration_fmt:fmt(b.duration), peaks:peaksOf(b)}; }
function setBuf(b, name){ stopSrc(); buf = b; off = 0; loopS = loopE = null; mem[sel] = {buf:b, name}; }

const api = {
  async get_profiles_summary(){ return Array.from({length: SLOTS}, (_, i) => prof[i] ? {name: prof[i].name} : null); },
  async get_tick(){
    const p = pos();
    return {duration: buf ? buf.duration : 0, position: p, position_fmt: fmt(p), loop_start: loopS, loop_end: loopE, level: level(), playing};
  },
  async load_file(tok){
    const f = reg[tok]; if (!f) return {ok:false};
    ensure(); const b = await ac.decodeAudioData(await f.arrayBuffer());
    setBuf(b, f.name); const r = info(f.name, b); if (window.applyLoadedFile) applyLoadedFile(r); return r;
  },
  open_file_dialog(){
    return new Promise(resolve => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'audio/*';
      let done = false;
      inp.onchange = async () => {
        done = true; const f = inp.files[0]; if (!f) return resolve({cancelled:true});
        ensure(); const b = await ac.decodeAudioData(await f.arrayBuffer());
        setBuf(b, f.name); const r = info(f.name, b); if (window.applyLoadedFile) applyLoadedFile(r); resolve(r);
      };
      inp.addEventListener('cancel', () => { if (!done) resolve({cancelled:true}); });
      inp.click();
    });
  },
  async select_slot(i){
    if (playing) stopSrc();
    sel = i; const p = prof[i] || {};
    kn = Object.assign({...KDEF}, p.knobs || {}); eqv = p.eq ? p.eq.slice() : [0,0,0,0,0];
    const kv = {}; Object.keys(kn).forEach(k => kv[k] = kn[k]);
    apply();
    if (!mem[i]){
      buf = null; loopS = loopE = null; off = 0;
      return {empty:true, name: p.name || '', knobs: kv, eq: eqv};
    }
    buf = mem[i].buf; off = 0;
    if (p.loop){ loopS = p.loop[0]; loopE = p.loop[1]; } else { loopS = loopE = null; }
    const r = info(mem[i].name, buf);
    return Object.assign(r, {empty:false, profile_name: p.name || '', knobs: kv, eq: eqv,
      loop_start: loopS, loop_end: loopE, loop_start_fmt: loopS != null ? fmt(loopS) : undefined, loop_end_fmt: loopE != null ? fmt(loopE) : undefined});
  },
  async save_state(name, knobs, eq){
    prof[sel] = {name, knobs: {...knobs}, eq: [...eq], loop: loopS != null ? [loopS, loopE] : null};
    saveProf(); return {ok:true, name};
  },
  async clear_slot(i){
    delete prof[i]; delete mem[i]; saveProf();
    if (i === sel){ stopSrc(); buf = null; loopS = loopE = null; off = 0; }
    return {ok:true};
  },
  async set_knob(k, v){ kn[k] = v; apply(); return {ok:true}; },
  async set_eq(i, v){ eqv[i] = v; apply(); return {ok:true}; },
  async set_loop(a, b){
    let s = parseT(a), e = parseT(b);
    if (buf){ s = Math.max(0, Math.min(s, buf.duration)); e = Math.min(e, buf.duration); }
    if (e <= s) return {ok:false, error:'loop'};
    loopS = s; loopE = e; restart();
    return {ok:true, start:s, end:e, start_fmt:fmt(s), end_fmt:fmt(e)};
  },
  async clear_loop(){ loopS = loopE = null; restart(); return {ok:true, duration_fmt: fmt(buf ? buf.duration : 0)}; },
  async seek_frac(f){ if (!buf) return {ok:false}; const p = Math.max(0, Math.min(1, f)) * buf.duration; if (playing){ stopSrc(); off = p; play(); } else off = p; return {ok:true}; },
  async go_start(){ if (playing){ stopSrc(); off = 0; play(); } else off = 0; return {ok:true}; },
  async stop(){ stopSrc(); off = 0; return {ok:true}; },
  async toggle_play(){
    if (!buf) return {ok:false, error:'nofile'};
    if (playing){ stopSrc(); return {ok:true, playing:false}; }
    play(); return {ok:true, playing:true};
  }
};
window.pywebview = {api};
window.pvRegister = f => { const t = 'f' + (++regN); reg[t] = f; return t; };
window.addEventListener('pageshow', () => { if (ac && ac.state === 'suspended') ac.resume(); });
})();
</script>

<meta charset="UTF-8">
<title>Loop Player</title>
<style>
:root{
  --acc-rgb:60,255,208; --glass-rgb:32,57,55; --panel-rgb:6,22,24;
  --bg-glow1:#1d4540; --bg-glow2:#143330;
  --bg:#0b1716; --bg2:#102422; --bg3:#17312f;
  --acc:#3cffd0; --acc-dim:#25b894; --acc-hot:#c8fff1;
  --text:#f2fffb; --muted:#75a096;
  --glass-fill: rgba(var(--glass-rgb),0.50);
  --glass-fill-2: rgba(var(--acc-rgb),0.05);
  --glass-edge: rgba(var(--acc-rgb),0.20);
  --glass-sheen: rgba(var(--acc-rgb),0.28);
  --glow: rgba(var(--acc-rgb),0.55);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  overflow-x:hidden; overflow-y:auto; -webkit-font-smoothing:antialiased;
  cursor:default;
}

/* ── Liquid neon background ──────────────────────────────────── */
.bg-wrap{position:fixed; inset:0; z-index:0; overflow:hidden; background:
  radial-gradient(ellipse at 20% 0%, var(--bg-glow1) 0%, transparent 55%),
  radial-gradient(ellipse at 85% 90%, var(--bg-glow2) 0%, transparent 55%),
  var(--bg);}
.blob{position:absolute; border-radius:50%; filter:blur(100px); background:var(--acc); will-change:transform,opacity;}
.b2,.b4{background:var(--acc2);}
.b1{width:560px; height:560px; top:-160px; left:-140px;  opacity:0.16; animation:drift1 22s ease-in-out infinite;}
.b2{width:480px; height:480px; bottom:-170px; right:-110px; opacity:0.14; animation:drift2 27s ease-in-out infinite;}
.b3{width:400px; height:400px; top:38%; right:18%; opacity:0.10; animation:drift3 33s ease-in-out infinite;}
.b4{width:340px; height:340px; bottom:6%; left:6%; opacity:0.12; animation:drift4 25s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(70px,90px) scale(1.18);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-80px,-55px) scale(1.12);}}
@keyframes drift3{0%,100%{transform:translate(0,0);} 50%{transform:translate(-60px,70px);}}
@keyframes drift4{0%,100%{transform:translate(0,0);} 50%{transform:translate(55px,-45px);}}

.grid-overlay{position:absolute; inset:0;
  background-image:linear-gradient(rgba(var(--acc-rgb),0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(var(--acc-rgb),0.05) 1px, transparent 1px);
  background-size:30px 30px; mix-blend-mode:screen; opacity:0.5;}

.scanline{position:absolute; left:0; right:0; height:120px; pointer-events:none;
  background:linear-gradient(to bottom, transparent, rgba(var(--acc-rgb),0.05), transparent);
  animation:scanFall 9s linear infinite;}
@keyframes scanFall{0%{transform:translateY(-160px);} 100%{transform:translateY(110vh);}}

.particles{position:absolute; inset:0; overflow:hidden;}
.particle{position:absolute; bottom:-10px; border-radius:50%; background:var(--acc);
  box-shadow:0 0 6px 1px var(--glow), 0 0 14px 3px rgba(var(--acc-rgb),0.35);
  animation-name:floatUp; animation-timing-function:ease-in-out; animation-iteration-count:infinite;}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0); opacity:0;}
  10%{opacity:0.9;}
  50%{transform:translateY(-52vh) translateX(14px);}
  90%{opacity:0.25;}
  100%{transform:translateY(-108vh) translateX(-10px); opacity:0;}
}

.app{position:relative; z-index:1; max-width:900px; margin:0 auto; padding:20px 20px 90px;}

/* ── Glass card, with a slow breathing glow border ──────────── */
.card{
  background:var(--glass-fill);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-edge);
  border-radius:16px;
  padding:16px 18px;
  margin-bottom:14px;
  box-shadow:0 8px 30px rgba(0,0,0,0.45), inset 0 1px 0 var(--glass-sheen), 0 0 0 rgba(var(--acc-rgb),0);
  animation:cardIn 0.6s cubic-bezier(.2,.8,.2,1) both, breathe 6s ease-in-out infinite;
}
.card:nth-of-type(1){animation-delay:0s, 0.4s;}
.card:nth-of-type(2){animation-delay:0.06s, 0.9s;}
.card:nth-of-type(3){animation-delay:0.12s, 1.4s;}
.card:nth-of-type(4){animation-delay:0.18s, 1.9s;}
.card:nth-of-type(5){animation-delay:0.24s, 2.4s;}
@keyframes cardIn{from{opacity:0; transform:translateY(14px) scale(0.985);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes breathe{0%,100%{box-shadow:0 8px 30px rgba(0,0,0,0.45), inset 0 1px 0 var(--glass-sheen), 0 0 0px rgba(var(--acc-rgb),0);}
  50%{box-shadow:0 8px 34px rgba(0,0,0,0.45), inset 0 1px 0 var(--glass-sheen), 0 0 22px rgba(var(--acc-rgb),0.10);}}

.card-title{display:flex; align-items:center; gap:8px; margin:0 0 12px; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:0.2px;}
.card-title .bar{width:3px; height:13px; background:var(--acc); border-radius:2px; display:inline-block;
  box-shadow:0 0 8px var(--glow); animation:barPulse 2.4s ease-in-out infinite;}
@keyframes barPulse{0%,100%{opacity:0.75;} 50%{opacity:1;}}

/* ── Header ──────────────────────────────────────────────────── */
header{display:flex; align-items:center; justify-content:space-between; padding:0 2px 10px;}
.brand{display:flex; align-items:center; cursor:pointer;}
.wordmark{height:104px; width:auto; display:block; overflow:visible; color:#f2fffb;
  filter:drop-shadow(0 0 14px rgba(var(--acc-rgb),0.20)); animation:wmGlow 5s ease-in-out infinite;}
@keyframes wmGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(var(--acc-rgb),0.14));} 50%{filter:drop-shadow(0 0 20px rgba(var(--acc-rgb),0.34));}}
/* easter egg: click the logo and the ring+arrow kick forward a bit —
   a separate wrapper group so it layers on top of the ring's own
   constant slow spin instead of replacing it. One smooth eased
   transition (slight overshoot baked into the curve, no keyframe
   waypoints), and it settles on the new angle instead of springing
   back to where it started. */
.mk-play{transform-box:fill-box; transform-origin:center; animation:mkPulse 2.6s ease-in-out infinite;
  filter:drop-shadow(0 0 5px rgba(var(--acc-rgb),0.7));}
@keyframes mkPulse{0%,100%{transform:scale(1); opacity:0.9;} 50%{transform:scale(1.09); opacity:1;}}
.filename{text-align:center; font-size:12px; color:var(--muted); margin-bottom:12px; transition:opacity 0.25s;}

/* ── Glass pill buttons ──────────────────────────────────────── */
.btn{
  position:relative; overflow:hidden;
  appearance:none; border:1px solid var(--glass-edge); border-radius:10px;
  background:rgba(var(--acc-rgb),0.05); backdrop-filter:blur(10px);
  color:var(--text); font:600 12.5px 'Segoe UI', sans-serif; padding:9px 16px;
  cursor:pointer; transition:background 0.15s, transform 0.08s, border-color 0.15s, box-shadow 0.2s;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn::before{content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
  transform:skewX(-20deg); transition:left 0.5s ease;}
.btn:hover::before{left:130%;}
.btn:hover{background:rgba(var(--acc-rgb),0.12); border-color:rgba(var(--acc-rgb),0.4); box-shadow:0 0 14px rgba(var(--acc-rgb),0.18);}
.btn:active{transform:scale(0.96);}
.btn.primary{background:linear-gradient(145deg, var(--acc-hot), var(--acc)); color:#06201b; border-color:rgba(0,0,0,0.15);
  box-shadow:0 0 16px rgba(var(--acc-rgb),0.30); animation:btnBreathe 3.2s ease-in-out infinite;}
.btn.primary:hover{filter:brightness(1.1); box-shadow:0 0 24px rgba(var(--acc-rgb),0.5);}
@keyframes btnBreathe{0%,100%{box-shadow:0 0 12px rgba(var(--acc-rgb),0.22);} 50%{box-shadow:0 0 22px rgba(var(--acc-rgb),0.42);}}
.btn.playing{background:linear-gradient(145deg, var(--acc-hot), var(--acc)); color:#06201b; animation:playPulseBtn 1.4s ease-in-out infinite;}
@keyframes playPulseBtn{0%,100%{box-shadow:0 0 14px rgba(var(--acc-rgb),0.35);} 50%{box-shadow:0 0 30px rgba(var(--acc-rgb),0.65);}}
.btn:disabled{opacity:0.4; cursor:default; pointer-events:none;}
.btn.textlink{background:transparent; border-color:transparent; color:var(--muted); box-shadow:none; padding:6px 10px;}
.btn.textlink:hover{color:var(--acc-hot); background:rgba(var(--acc-rgb),0.06); box-shadow:none;}

/* ── Open-file button, drop zone, settings — header action group ─ */
.header-actions{display:flex; align-items:center; gap:10px;}
.btn svg{width:15px; height:15px; flex:none; display:block;}
.btn.icon{padding:9px; width:34px; height:34px; justify-content:center;}
.btn.icon svg{width:16px; height:16px;}

.btn.open{
  position:relative; padding:10px 18px 10px 14px; font-size:13px; letter-spacing:0.2px;
  background:linear-gradient(145deg, var(--acc-hot), var(--acc), var(--acc-dim));
  background-size:220% 220%; color:#06201b; border-color:rgba(0,0,0,0.15);
  box-shadow:0 0 18px rgba(var(--acc-rgb),0.35), 0 4px 14px rgba(0,0,0,0.35);
  animation:openBreathe 2.6s ease-in-out infinite, openShift 5s ease-in-out infinite;
}
.btn.open:hover{filter:brightness(1.12); box-shadow:0 0 30px rgba(var(--acc-rgb),0.6), 0 4px 16px rgba(0,0,0,0.4); transform:translateY(-1px);}
.btn.open:active{transform:translateY(0) scale(0.96);}
@keyframes openBreathe{0%,100%{box-shadow:0 0 18px rgba(var(--acc-rgb),0.35), 0 4px 14px rgba(0,0,0,0.35);}
  50%{box-shadow:0 0 30px rgba(var(--acc-rgb),0.6), 0 4px 14px rgba(0,0,0,0.35);}}
@keyframes openShift{0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;}}

.dropzone{
  position:relative; display:flex; align-items:center; gap:11px; overflow:hidden;
  border:2px dashed var(--glass-edge); border-radius:14px; padding:18px 32px;
  background:rgba(var(--acc-rgb),0.04); color:var(--muted); font:600 14px 'Segoe UI', sans-serif;
  cursor:pointer; user-select:none; white-space:nowrap;
  transition:border-color 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.15s;
}
.dropzone svg{width:23px; height:23px; transition:transform 0.2s;}
.dropzone.drag{
  border-color:var(--acc); border-style:solid; color:var(--acc-hot);
  background:rgba(var(--acc-rgb),0.16); box-shadow:0 0 22px rgba(var(--acc-rgb),0.4), inset 0 0 16px rgba(var(--acc-rgb),0.14);
  transform:scale(1.05);
}
.dropzone.drag svg{transform:translateY(-2px);}
.dropzone.bad{
  border-color:#ff4d4d; border-style:solid; color:#ff8080;
  background:rgba(255,60,60,0.14); box-shadow:0 0 22px rgba(255,60,60,0.35), inset 0 0 16px rgba(255,60,60,0.12);
  transform:scale(1.05);
}
.dropzone.bad svg{transform:translateY(-2px);}
.dropzone.shake{animation:dzShake 0.35s ease;}
@keyframes dzShake{20%{transform:translateX(-4px) scale(1.05);} 40%{transform:translateX(4px) scale(1.05);} 60%{transform:translateX(-3px) scale(1.05);} 80%{transform:translateX(3px) scale(1.05);} 100%{transform:translateX(0) scale(1.05);}}

/* sonar ping ring around the transport play button while playing */
.playwrap{position:relative; display:inline-flex;}
.playwrap::after{content:''; position:absolute; inset:0; border-radius:10px; pointer-events:none;
  border:1px solid var(--acc); opacity:0; }
.playwrap.playing::after{animation:sonar 1.6s ease-out infinite;}
@keyframes sonar{0%{opacity:0.7; transform:scale(1);} 100%{opacity:0; transform:scale(1.35);}}

/* ── Progress / VU / transport (merged card) ─────────────────── */
.vurow{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
#vu{flex:1 1 auto; min-width:0; height:12px; border-radius:6px; display:block; background:var(--bg3);}
#prog{width:100%; height:64px; border-radius:8px; display:block; cursor:pointer; background:var(--bg2); border:1px solid var(--glass-edge);}
.posrow{display:flex; align-items:center; margin-top:10px;}
#lblPos{font:700 15px 'Consolas', monospace; color:var(--acc-hot); text-shadow:0 0 10px rgba(var(--acc-rgb),0.4);}
#lblDur{font:12px 'Consolas', monospace; color:var(--muted); margin-left:8px;}
#lblBadge{margin-left:auto; font:700 11px 'Segoe UI'; background:linear-gradient(145deg, var(--acc-hot), var(--acc)); color:#06201b;
  padding:4px 10px; border-radius:8px; display:none; box-shadow:0 0 12px rgba(var(--acc-rgb),0.35); animation:badgeBlink 2.2s ease-in-out infinite;}
@keyframes badgeBlink{0%,100%{opacity:1;} 50%{opacity:0.78;}}
.transport{display:flex; align-items:center; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--glass-edge); flex-wrap:wrap;}

/* ── Beat-sensitivity indicator (the 3 dots left of the VU bar) ─ */
.sensi{display:flex; align-items:center; gap:6px; flex:none; padding:3px 6px 3px 5px; border-radius:8px;
  cursor:pointer; transition:background 0.15s;}
.sensi:hover{background:rgba(var(--acc-rgb),0.08);}
.sensi-dot{width:8px; height:8px; border-radius:50%; display:inline-block; background:#1c2e2b;
  box-shadow:inset 0 0 2px rgba(0,0,0,0.4); transition:background 0.3s ease, box-shadow 0.4s ease;}
.sensi-dot.lit.g{background:#5dff8a; box-shadow:0 0 5px 1px rgba(93,255,138,0.85), 0 0 12px 3px rgba(93,255,138,0.45);}
.sensi-dot.lit.y{background:#ffe85d; box-shadow:0 0 5px 1px rgba(255,232,93,0.85), 0 0 12px 3px rgba(255,232,93,0.45);}
.sensi-dot.lit.r{background:#ff5d5d; box-shadow:0 0 5px 1px rgba(255,93,93,0.85), 0 0 12px 3px rgba(255,93,93,0.45);}
.sensi-dot.ignite{animation:dotIgnite 0.45s cubic-bezier(.2,.8,.2,1);}
@keyframes dotIgnite{0%{transform:scale(0.5);} 55%{transform:scale(1.45);} 100%{transform:scale(1);}}

/* ── Balance (pan) slider + mute, next to the transport buttons ─ */
.panwrap{display:flex; flex-direction:column; gap:4px; flex:1 1 150px; max-width:230px; margin-left:auto; min-width:130px;}
.panhead{display:flex; justify-content:space-between; align-items:baseline;}
.panhead .nm{font:700 11px 'Segoe UI'; color:var(--muted);}
.panhead .val{font:700 12px 'Consolas', monospace; color:var(--acc-hot); text-shadow:0 0 8px rgba(var(--acc-rgb),0.4); min-width:28px; text-align:right;}
.pan-slide-row{display:flex; align-items:center; gap:6px;}
.pan-slide-row input[type=range]{flex:1;}
.panside{font:700 10px 'Segoe UI'; color:var(--muted); flex:none;}
#btnMute.muted{color:#ff8080; border-color:rgba(255,90,90,0.5); box-shadow:0 0 12px rgba(255,90,90,0.25);}
#btnMute.muted:hover{background:rgba(255,90,90,0.12); border-color:rgba(255,90,90,0.6);}

/* ── Loop region ─────────────────────────────────────────────── */
.looprow{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap;}

.tc{display:flex; align-items:center; gap:3px;}
.field .tc input[type=text]{width:40px; padding:8px 0; text-align:center; cursor:ns-resize; user-select:none;}
.field .tc input[type=text]:focus{cursor:text; user-select:text;}
.tc i{font-style:normal; color:var(--muted); font-weight:700;}
.field label{display:block; font:700 10px 'Segoe UI'; color:var(--muted); margin-bottom:5px; letter-spacing:0.3px;}
.field input[type=text]{
  width:100px; font:13px 'Consolas', monospace; color:var(--text);
  background:rgba(var(--acc-rgb),0.05); border:1px solid var(--glass-edge); border-radius:8px; padding:8px 10px;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.field input[type=text]:focus{outline:none; border-color:var(--acc); box-shadow:0 0 10px rgba(var(--acc-rgb),0.3);}
.loopbtns{display:flex; gap:6px; margin-left:auto;}

/* ── Knob / EQ cells ─────────────────────────────────────────── */
.snaprow{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.snaprow .snaplbl{font:700 11px 'Segoe UI'; color:var(--muted);}
#snapVal{font:700 13px 'Consolas', monospace; color:var(--acc-hot); min-width:34px; text-align:center; text-shadow:0 0 8px rgba(var(--acc-rgb),0.4);}
.snaprow .hint{margin-left:auto; font-size:10.5px; color:var(--muted);}
.knobgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.knobcell{background:var(--glass-fill-2); border:1px solid var(--glass-edge); border-radius:10px; padding:10px 12px;
  transition:box-shadow 0.2s, border-color 0.2s;}
.knobcell:hover{border-color:rgba(var(--acc-rgb),0.4); box-shadow:0 0 14px rgba(var(--acc-rgb),0.12);}
.knobhead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.knobhead .nm{font:700 11px 'Segoe UI'; color:var(--muted);}
.knobhead .val{font:700 13px 'Consolas', monospace; transition:text-shadow 0.15s;}
.reset-row{display:flex; justify-content:flex-end; margin-top:12px;}

input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:22px; background:transparent; cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{height:6px; border-radius:4px; background:var(--bg3); border:1px solid var(--glass-edge);}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; margin-top:-7px; width:18px; height:18px; border-radius:50%;
  background:var(--text); border:2px solid var(--knob-col, var(--acc));
  box-shadow:0 0 10px var(--knob-col, var(--glow)), 0 0 0 3px rgba(var(--acc-rgb),0.06);
  transition:box-shadow 0.15s, transform 0.1s;
}
input[type=range]:active::-webkit-slider-thumb, input[type=range]:hover::-webkit-slider-thumb{
  transform:scale(1.15); box-shadow:0 0 16px var(--knob-col, var(--glow)), 0 0 0 4px rgba(var(--acc-rgb),0.1);
}
input[type=range]::-moz-range-track{height:6px; border-radius:4px; background:var(--bg3); border:1px solid var(--glass-edge);}
input[type=range]::-moz-range-thumb{
  width:16px; height:16px; border-radius:50%; background:var(--text); border:2px solid var(--knob-col, var(--acc));
  box-shadow:0 0 10px var(--knob-col, var(--glow));
}

.eqrow{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.eqcell{background:var(--glass-fill-2); border:1px solid var(--glass-edge); border-radius:10px;
  padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:box-shadow 0.2s, border-color 0.2s;}
.eqcell:hover{border-color:rgba(var(--acc-rgb),0.4); box-shadow:0 0 14px rgba(var(--acc-rgb),0.12);}
.eqcell .val{font:700 10.5px 'Consolas', monospace;}
.eqcell .freq{font:10px 'Segoe UI'; color:var(--muted);}

.tipbtn{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; margin-left:5px;
  border-radius:50%; border:1px solid var(--muted); color:var(--muted); font:700 10px/1 'Segoe UI';
  cursor:help; vertical-align:middle; user-select:none; flex:none;}
.tipbtn:hover, .tipbtn.active{border-color:var(--acc); color:var(--acc); box-shadow:0 0 6px rgba(var(--acc-rgb),0.4);}
.eqcell .freq{display:flex; align-items:center; justify-content:center;}
#tipPopover{position:fixed; z-index:999; max-width:220px; max-height:min(320px, calc(100vh - 20px));
  overflow-y:auto; padding:9px 11px; font:12px/1.4 'Segoe UI';
  color:var(--text); background:rgba(var(--panel-rgb),0.96); border:1px solid var(--glass-edge); border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,0.5), 0 0 14px rgba(var(--acc-rgb),0.15); backdrop-filter:blur(10px);
  will-change:transform, opacity;
  pointer-events:none; opacity:0; transform:translateY(-3px) scale(0.94); transform-origin:top center;
  /* Closing gets its own quick, fast-finishing ease instead of the opening
     curve played backwards (that bounce-flavoured curve lingered near the
     end, which read as a jerky stop) — and a much smaller scale range
     than a full scale(0), so the blurred glass behind it isn't resampled
     at a wildly different size on every frame. */
  transition:transform 0.14s cubic-bezier(.4,0,1,1), opacity 0.14s cubic-bezier(.4,0,1,1);}
#tipPopover.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;
  transition:transform 0.2s cubic-bezier(.2,.8,.2,1), opacity 0.2s cubic-bezier(.2,.8,.2,1);}
.eq-wrap{height:118px; width:40px; display:flex; align-items:center; justify-content:center;}
.eq-wrap input[type=range]{width:110px; transform:rotate(-90deg);}

/* ── Profiles (slots) ────────────────────────────────────────── */
.slotgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:10px;}
.slot{
  position:relative;
  background:rgba(var(--acc-rgb),0.035); border:1px solid var(--glass-edge); border-radius:9px;
  padding:7px 4px; font:700 10px 'Segoe UI'; color:var(--muted); text-align:center; cursor:pointer;
  min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  transition:background 0.15s, color 0.15s, transform 0.12s, box-shadow 0.2s;
  animation:slotPop 0.32s cubic-bezier(.25,1.3,.4,1) both;
}
@keyframes slotPop{from{opacity:0; transform:scale(0.55);} to{opacity:1; transform:scale(1);}}
.slot:hover{transform:translateY(-2px); box-shadow:0 4px 14px rgba(var(--acc-rgb),0.15);}
.slot.removing{animation:slotOut 0.22s ease forwards;}
@keyframes slotOut{to{opacity:0; transform:scale(0.5) rotate(6deg);}}
.slot.shake{animation:slotShake 0.35s ease;}
@keyframes slotShake{20%{transform:translateX(-4px);} 40%{transform:translateX(4px);} 60%{transform:translateX(-3px);} 80%{transform:translateX(3px);} 100%{transform:translateX(0);}}
.slot .n{opacity:0.6; font-size:9px;}
.slot .nm{max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.slot.occupied{background:rgba(var(--acc-rgb),0.10); color:var(--text);}
.slot.selected{background:linear-gradient(145deg, var(--acc-hot), var(--acc)); color:#06201b; border-color:transparent;
  box-shadow:0 0 16px rgba(var(--acc-rgb),0.5); animation:slotPop 0.32s cubic-bezier(.25,1.3,.4,1) both, slotPulse 2s ease-in-out infinite;}
@keyframes slotPulse{0%,100%{box-shadow:0 0 12px rgba(var(--acc-rgb),0.4);} 50%{box-shadow:0 0 22px rgba(var(--acc-rgb),0.65);}}
.slotfooter{display:flex; align-items:center; gap:10px;}
.profrow{display:flex; gap:8px; align-items:center; margin-top:10px;}
.profrow label{font:700 10px 'Segoe UI'; color:var(--muted); white-space:nowrap;}
#profName{flex:1; font:13px 'Segoe UI'; color:var(--text); background:rgba(var(--acc-rgb),0.05);
  border:1px solid var(--glass-edge); border-radius:8px; padding:8px 10px; transition:border-color 0.2s, box-shadow 0.2s;}
#profName:focus{outline:none; border-color:var(--acc); box-shadow:0 0 10px rgba(var(--acc-rgb),0.3);}

/* ── Status bar ──────────────────────────────────────────────── */
#statusbar{
  position:fixed; left:0; right:0; bottom:0; z-index:2;
  background:rgba(4,16,16,0.75); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--glass-edge); color:var(--muted); font-size:11.5px; padding:8px 18px;
  transition:transform 0.4s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease;
}
#statusbar.pulse{color:var(--acc-hot); text-shadow:0 0 8px rgba(var(--acc-rgb),0.4);}

/* ── Settings button + sliding panel ─────────────────────────── */
.btn.icon{padding:9px 11px; font-size:15px; line-height:1;}
.settings-overlay{position:fixed; top:0; bottom:0; left:0; right:0; background:rgba(4,16,16,0.28);
  z-index:9; opacity:0; pointer-events:none; transition:opacity 0.25s ease;}
.settings-overlay.show{opacity:1; pointer-events:auto;}
/* the dim covers only the area left of the panel, so the translucent panel itself is never darkened */
.settings-panel{
  position:fixed; top:0; right:0; bottom:0; width:clamp(300px, 22vw + 10vh, 480px); max-width:88vw; z-index:10;
  background:rgba(var(--glass-rgb),0.74); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
  border-left:1px solid var(--glass-edge);
  box-shadow:-10px 0 34px rgba(0,0,0,0.35), inset 1px 0 0 var(--glass-sheen);
  transform:translateX(100%); transition:transform 0.4s cubic-bezier(.2,.8,.2,1);
  display:flex; flex-direction:column; padding:20px;
}
.settings-panel.show{transform:translateX(0);}
.settings-body{min-height:0;}
/* while settings are open the main page does not scroll; the panel keeps its own scroll */
body.settings-open{overflow:hidden !important;}
.settings-toggle-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.switch{position:relative; width:42px; height:24px; border-radius:999px; border:1px solid var(--glass-edge);
  background:rgba(var(--acc-rgb),0.08); cursor:pointer; padding:0; flex:none; transition:background .2s, border-color .2s;}
.switch .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--muted);
  transition:transform .2s cubic-bezier(.2,.8,.2,1), background .2s;}
.switch.on{background:var(--acc); border-color:transparent;}
.switch.on .knob{transform:translateX(18px); background:#111418;}
body.no-statusbar #statusbar{transform:translateY(calc(100% + 60px)); opacity:0; pointer-events:none;}
.settings-panel, .settings-body{overscroll-behavior:contain;}
.settings-panel h2{margin:0; font-size:15px; display:flex; align-items:center; gap:8px; color:var(--text);}
.settings-panel h2 .bar{width:3px; height:14px; background:var(--acc); border-radius:2px; display:inline-block; box-shadow:0 0 8px var(--glow);}
.settings-close{position:absolute; top:16px; right:16px; background:transparent; border:1px solid var(--glass-edge); color:var(--muted);
  width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center;
  transition:color 0.15s, border-color 0.15s, background 0.15s;}
.settings-close:hover{color:var(--acc-hot); border-color:var(--acc); background:rgba(var(--acc-rgb),0.08);}
.settings-body{margin-top:20px; overflow-y:auto; flex:1; color:var(--muted); font-size:12.5px;}
.settings-row{margin-bottom:18px;}
.settings-row label{display:block; font:700 10px 'Segoe UI'; color:var(--muted); margin-bottom:7px; letter-spacing:0.3px; text-transform:uppercase;}
.settings-row select{
  width:100%; font:600 13px 'Segoe UI', sans-serif; color:var(--text);
  background:rgba(var(--acc-rgb),0.06); border:1px solid var(--glass-edge); border-radius:10px; padding:9px 12px;
  cursor:pointer; appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2375a096' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat; background-position:right 12px center;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.settings-row select:focus{outline:none; border-color:var(--acc); box-shadow:0 0 10px rgba(var(--acc-rgb),0.3);}
.settings-row select option{background:var(--bg2); color:var(--text);}

/* ── custom language dropdown (native <select> popups can't be themed,
   so this is a small glass listbox built to match the rest of the UI) ── */
.lang-select{position:relative;}
.lang-select-btn{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
  font:600 13px 'Segoe UI', sans-serif; color:var(--text);
  background:rgba(var(--acc-rgb),0.06); border:1px solid var(--glass-edge); border-radius:10px;
  padding:9px 12px; cursor:pointer; appearance:none; -webkit-appearance:none;
  transition:border-color 0.2s, box-shadow 0.2s, background 0.15s;
}
.lang-select-btn:hover{background:rgba(var(--acc-rgb),0.12); border-color:rgba(var(--acc-rgb),0.4);}
.lang-select-btn[aria-expanded="true"]{border-color:var(--acc); box-shadow:0 0 10px rgba(var(--acc-rgb),0.3);}
.lang-chevron{flex:none; color:var(--muted); transition:transform 0.2s, color 0.2s;}
.lang-select-btn[aria-expanded="true"] .lang-chevron{transform:rotate(180deg); color:var(--acc);}
.lang-options{
  position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20;
  background:rgba(var(--panel-rgb),0.97); border:1px solid var(--glass-edge); border-radius:12px;
  padding:6px; max-height:260px; overflow-y:auto;
  box-shadow:0 10px 30px rgba(0,0,0,0.5), 0 0 16px rgba(var(--acc-rgb),0.15);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  opacity:0; transform:translateY(-6px) scale(0.98); transform-origin:top center; pointer-events:none;
  transition:opacity 0.16s ease, transform 0.16s cubic-bezier(.2,.8,.2,1);
}
.lang-options.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
.lang-option{
  padding:8px 10px; border-radius:8px; font:600 12.5px 'Segoe UI'; color:var(--text);
  cursor:pointer; transition:background 0.12s, color 0.12s;
}
.lang-option:hover{background:rgba(var(--acc-rgb),0.10); color:var(--acc-hot);}
.lang-option.selected{background:linear-gradient(145deg, var(--acc-hot), var(--acc)); color:#06201b;}

/* ── theme picker bits ─────────────────────────────────────── */
.lang-option{display:flex; align-items:center;}
.theme-group{padding:8px 10px 4px; font:700 10px 'Segoe UI', sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); opacity:.85;}
.theme-dot{width:10px; height:10px; border-radius:50%; flex:none; margin-right:9px; box-shadow:0 0 8px currentColor;}

/* ── theme reboot overlay (~3s, colours morph through it) ──── */
/* while the overlay covers the app, the app is hidden so the per-frame palette
   morph only repaints the overlay (blurred glass layers are very expensive) */
body.rb-active .bg-wrap, body.rb-active .app, body.rb-active .settings-panel, body.rb-active .settings-overlay{visibility:hidden;}
.reboot{position:fixed; inset:0; z-index:1000; display:none; flex-direction:column; justify-content:center;
  padding:8vh 9vw; overflow:hidden; opacity:0; pointer-events:none; color:var(--acc);
  font-family:'Segoe UI',system-ui,sans-serif;
  background:radial-gradient(ellipse at 15% 10%, var(--bg-glow1) 0%, transparent 60%),
             radial-gradient(ellipse at 90% 95%, var(--bg-glow2) 0%, transparent 55%), var(--bg);}
.reboot.show{display:flex; pointer-events:auto;}
.reboot.fade-in{animation:rbFadeIn .3s ease forwards;}
.reboot.fade-out{animation:rbFadeOut .5s ease forwards;}
.rb-grid{position:absolute; inset:0; opacity:.9;
  background-image:linear-gradient(rgba(var(--acc-rgb),.08) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--acc-rgb),.08) 1px,transparent 1px);
  background-size:34px 34px; -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%); mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);}
.rb-scan{position:absolute; left:0; right:0; top:0; height:180px; pointer-events:none;
  background:linear-gradient(to bottom, transparent, rgba(var(--acc-rgb),.18), transparent); animation:rbScan 1.9s linear infinite;}
.rb-main{position:relative; z-index:1; display:flex; flex-direction:column; align-items:flex-start; max-width:620px;}
.rb-head{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; letter-spacing:.3em; color:var(--muted); margin-bottom:16px;}
.rb-pct{font-size:clamp(56px,11vw,124px); font-weight:800; line-height:1; letter-spacing:-.03em; color:var(--acc); font-variant-numeric:tabular-nums;
  text-shadow:0 0 22px rgba(var(--acc-rgb),.65), 0 0 64px rgba(var(--acc-rgb),.28);}
.rb-name{margin-top:12px; font-weight:700; font-size:clamp(16px,2.4vw,22px); letter-spacing:.06em; color:var(--text);}
.rb-name.glitch{animation:rbGlitch .55s steps(2,end) 1;}
.reboot-lines{margin-top:26px; min-height:124px; white-space:pre-line; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.75; color:var(--text); opacity:.85;}
.reboot-bar{margin-top:22px; width:min(420px,80vw); height:8px; border-radius:4px; overflow:hidden;
  background:rgba(var(--acc-rgb),.12); box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.22);}
.reboot-fill{height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg, var(--acc-dim), var(--acc), var(--acc-hot)); box-shadow:0 0 16px var(--acc);}
.reboot-label{margin-top:12px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
@keyframes rbScan{from{transform:translateY(-180px);} to{transform:translateY(110vh);}}
/* ── single reboot screen (same for every theme type) ── */
.reboot .rb-art{display:none !important;}
.reboot .rb-grid{display:none;}
.reboot .rb-scan{display:none;}
.reboot{align-items:center; justify-content:center; text-align:center; padding:6vh 8vw;}
.reboot::after{content:''; position:absolute; left:50%; top:50%; width:min(70vw,620px); height:min(70vw,620px);
  transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(var(--acc-rgb),.16) 0%, transparent 65%);
  animation:rbPulse 3s ease-in-out infinite;}
@keyframes rbPulse{0%,100%{transform:translate(-50%,-50%) scale(.92); opacity:.7;} 50%{transform:translate(-50%,-50%) scale(1.06); opacity:1;}}
.reboot .rb-main{align-items:center; max-width:460px; width:100%; position:relative; z-index:1;}
.reboot .rb-head{font-size:10px; letter-spacing:.32em; color:var(--muted); margin-bottom:14px;}
.reboot .rb-pct{font-size:clamp(64px,12vw,120px); font-weight:300; letter-spacing:-.02em; color:var(--acc);}
.reboot .rb-name{margin-top:6px; font-size:15px; font-weight:600; letter-spacing:.08em; color:var(--text);}
.reboot .reboot-lines{margin-top:22px; min-height:0; width:100%; font-size:12px; line-height:1.9; color:var(--muted); opacity:1; text-align:center;}
.reboot .reboot-bar{margin-top:24px; width:min(340px,70vw); height:3px; border-radius:2px; background:rgba(var(--acc-rgb),.14); box-shadow:none;}
.reboot .reboot-fill{border-radius:2px; background:var(--acc); box-shadow:0 0 12px var(--acc);}
.reboot .reboot-label{margin-top:14px; font-size:11px; letter-spacing:.2em; color:var(--muted);}
@keyframes rbGlitch{
  0%{transform:translateX(-3px); text-shadow:3px 0 rgba(255,60,110,.8), -3px 0 rgba(var(--acc-rgb),.8);}

@keyframes rbFadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes rbFadeOut{from{opacity:1;} to{opacity:0;}}

/* ── Plum type (dashboard) ──────────────────────────────────────
   Flat surfaces with a few soft, lightly blurred circles drifting slowly
   in the background; cards use one light-to-dark step; the active button
   is a light-to-accent gradient. Nothing emits light: no glow, no halos. */
body[data-style="plum"] .grid-overlay,
body[data-style="plum"] .scanline,
body[data-style="plum"] .particles{display:none !important;}
body[data-style="plum"] *{
  text-shadow:none !important; filter:none !important; box-shadow:none !important;
  backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
  animation-name:none !important;}

/* background circles: light blur, passive drift */
body[data-style="plum"] .blob{display:block !important; filter:blur(46px) !important; opacity:.22 !important;}
body[data-style="plum"] .b1{animation-name:drift1 !important;}
body[data-style="plum"] .b2{animation-name:drift2 !important;}
body[data-style="plum"] .b3{animation-name:drift3 !important;}
body[data-style="plum"] .b4{animation-name:drift4 !important;}
body[data-style="plum"] .b2,
body[data-style="plum"] .b4{opacity:.14 !important;}
body[data-style="plum"] .bg-wrap{background:var(--bg) !important;}
body[data-style="plum"] .bg-wrap::before,
body[data-style="plum"] .bg-wrap::after{display:none;}

/* card: gradient from bg3 (lighter) down to bg2 */
body[data-style="plum"] .card{
  background:linear-gradient(180deg, var(--bg3) 0%, var(--bg2) 100%);
  border:1px solid rgba(255,255,255,0.05); border-radius:24px;
  padding:18px 20px; margin-bottom:16px;
  box-shadow:0 16px 30px -14px rgba(0,0,0,0.6) !important;
  animation-name:cardIn !important;}
body[data-style="plum"] .card-title{color:var(--muted); font-weight:700; letter-spacing:0.3px;}
body[data-style="plum"] .card-title .bar{width:8px; height:8px; border-radius:50%; background:var(--acc2);}
body[data-style="plum"] .card:nth-of-type(even) .card-title .bar{background:var(--acc);}

/* buttons: solid pills; active one is a light-to-accent gradient */
body[data-style="plum"] .btn{
  border:none; border-radius:999px; background:var(--bg3); color:var(--text);
  padding:9px 18px; box-shadow:0 6px 12px -6px rgba(0,0,0,0.6) !important;}
body[data-style="plum"] .btn:hover{background:var(--glass);}
body[data-style="plum"] .btn:active{transform:translateY(1px);}
body[data-style="plum"] .btn.textlink{background:transparent; color:var(--muted); box-shadow:none !important; padding:6px 10px;}
body[data-style="plum"] .btn.textlink:hover{background:transparent; color:var(--acc2);}
body[data-style="plum"] .btn.primary,
body[data-style="plum"] .btn.open,
body[data-style="plum"] .btn.playing{
  border:none; color:var(--bg);
  background:linear-gradient(135deg, var(--acc-hot) 0%, var(--acc) 100%);
  box-shadow:0 8px 16px -8px rgba(0,0,0,0.6) !important;}
body[data-style="plum"] .btn.primary:hover,
body[data-style="plum"] .btn.open:hover{background:linear-gradient(135deg, var(--acc-hot) 0%, var(--acc) 100%); filter:brightness(1.05);}

/* tiles, slots and sliders: solid */
body[data-style="plum"] .dropzone,
body[data-style="plum"] .knobcell,
body[data-style="plum"] .eqcell,
body[data-style="plum"] .slot,
body[data-style="plum"] .lang-select-btn{border:none; border-radius:18px; background:var(--bg);}
body[data-style="plum"] .slot.active,
body[data-style="plum"] .slot.on{background:var(--acc); color:var(--bg);}
body[data-style="plum"] #prog,
body[data-style="plum"] #vu{border-radius:999px; border:none; background:var(--bg3);}
body[data-style="plum"] input[type=range]::-webkit-slider-runnable-track,
body[data-style="plum"] input[type=range]::-moz-range-track{background:var(--bg3); border:none;}
body[data-style="plum"] input[type=range]::-webkit-slider-thumb,
body[data-style="plum"] input[type=range]::-moz-range-thumb{
  background:var(--knob-col, var(--acc)); border:3px solid var(--bg2);}
body[data-style="plum"] .settings-panel{background:var(--bg2); border:none;}

/* reboot screen in the Plum type: a rounded panel over drifting circles,
   sans-serif, solid progress bar, no grid, no scanline, no terminal font */
.reboot[data-rb="plum"]{background:var(--bg); font-family:'Segoe UI',system-ui,sans-serif;}
.reboot[data-rb="plum"].fade-in{animation-name:rbFadeIn !important;}
.reboot[data-rb="plum"].fade-out{animation-name:rbFadeOut !important;}
.reboot[data-rb="plum"] .rb-scan{display:none;}
.reboot[data-rb="plum"] .rb-grid{background:none; -webkit-mask-image:none; mask-image:none;}
.reboot[data-rb="plum"] .rb-grid::before,
.reboot[data-rb="plum"] .rb-grid::after{content:''; position:absolute; border-radius:50%; filter:blur(52px); opacity:.2;}
.reboot[data-rb="plum"] .rb-grid::before{width:520px; height:520px; left:6%; top:8%; background:var(--acc); animation:drift1 22s ease-in-out infinite;}
.reboot[data-rb="plum"] .rb-grid::after{width:460px; height:460px; right:4%; bottom:6%; background:var(--acc2); animation:drift2 27s ease-in-out infinite;}
.reboot[data-rb="plum"] .rb-main{background:linear-gradient(180deg, var(--bg3) 0%, var(--bg2) 100%); border-radius:28px;
  padding:34px 38px; border:1px solid rgba(255,255,255,0.05); box-shadow:0 24px 50px -20px rgba(0,0,0,0.6) !important;}
.reboot[data-rb="plum"] .rb-head{font-family:inherit; font-size:11px; letter-spacing:.22em; color:var(--muted); margin-bottom:12px;}
.reboot[data-rb="plum"] .rb-pct{font-size:clamp(52px,10vw,104px); color:var(--acc);}
.reboot[data-rb="plum"] .rb-name{color:var(--text);}
.reboot[data-rb="plum"] .reboot-lines{font-family:inherit; font-size:14px; color:var(--muted); opacity:1;}
.reboot[data-rb="plum"] .reboot-bar{background:var(--bg); border-radius:999px;}
.reboot[data-rb="plum"] .reboot-fill{background:var(--acc); border-radius:999px;}
.reboot[data-rb="plum"] .reboot-label{color:var(--muted);}

/* ── reboot screen per theme TYPE (colours come from the palette and morph as before) ── */
/* Neon = base .reboot look (grid, scan line, glow). Aesthetic = plum block above.
   Geometric = flat Swiss/Bauhaus poster: hard shapes, hard shadow, no blur, no glow.
   Liquid = gooey droplets that fall into a pool that rises with the progress. */
.rb-art{display:none; position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.reboot[data-rb="geo"] .rb-art.geo,
.reboot[data-rb="liquid"] .rb-art.liq{display:block;}


/* geometric screens: dark and light variants, both in the geometric look */
.reboot[data-rb^="geo"] .rb-art.geo{display:block !important;}
.reboot[data-rb^="geo"]::after{display:none;}
.reboot[data-rb^="geo"] .rb-main{align-items:stretch; text-align:left;}
.reboot[data-rb^="geo"] .rb-pct{font-weight:900;}
.reboot[data-rb^="geo"] .reboot-lines{text-align:left;}
.reboot[data-rb="geo-dark"] .rb-art.geo .geo-s svg{opacity:.95;}
.reboot[data-rb="geo-light"] .rb-art.geo .geo-s svg{opacity:.8;}
.reboot[data-rb="geo-light"] .rb-main{background:color-mix(in srgb, var(--bg2) 94%, #fff 6%);}
.reboot[data-rb="geo-dark"] .rb-main{background:color-mix(in srgb, var(--bg2) 92%, #000 8%);}

/* geometric: same look as the Geo theme (scattered SVG shapes that float, chamfered panel, 4-colour stripe) */
.reboot[data-rb^="geo"]{background:var(--bg);}
.reboot[data-rb^="geo"] .rb-grid, .reboot[data-rb^="geo"] .rb-scan{display:none;}
.rb-art.geo .geo-s{position:absolute; will-change:transform;}
.rb-art.geo .geo-s svg{width:100%; height:100%; display:block; overflow:visible;
  animation:geoFloat var(--dur) ease-in-out var(--del) infinite alternate;}
@keyframes geoFloat{from{transform:rotate(var(--r0)) translate(0,0);} to{transform:rotate(var(--r1)) translate(var(--dx),var(--dy));}}
.reboot[data-rb^="geo"] .rb-main{position:relative; z-index:1; background:color-mix(in srgb, var(--bg2) 88%, transparent);
  padding:34px 34px 28px; max-width:580px;
  clip-path:polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);}
.reboot[data-rb^="geo"] .rb-main::before{content:''; position:absolute; left:0; right:0; top:0; height:4px;
  background:linear-gradient(90deg,#FF3333 0 25%,#FFDD5C 25% 50%,#38B6FF 50% 75%,#00BE63 75%);}
.reboot[data-rb^="geo"] .rb-head{display:flex; align-items:center; gap:10px; font-family:inherit; font-weight:700; font-size:11px;
  letter-spacing:.14em; color:var(--muted); margin-bottom:16px;}
.reboot[data-rb^="geo"] .rb-head::before{content:''; width:10px; height:10px; background:var(--acc); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.reboot[data-rb^="geo"] .rb-pct{font-family:inherit; font-weight:900; letter-spacing:-.05em; color:var(--acc); text-shadow:none;}
.reboot[data-rb^="geo"] .rb-name{font-weight:700; letter-spacing:.3px; color:var(--text);}
.reboot[data-rb^="geo"] .reboot-lines{font-family:inherit; font-weight:600; font-size:13px; line-height:1.8; color:var(--text); opacity:1;}
.reboot[data-rb^="geo"] .reboot-bar{width:100%; height:12px; margin-top:20px; border-radius:0; background:var(--bg3); box-shadow:none;}
.reboot[data-rb^="geo"] .reboot-fill{border-radius:0; box-shadow:none; background:var(--acc);}
.reboot[data-rb^="geo"] .reboot-label{font-weight:700; color:var(--muted);}

/* liquid: goo filter merges the drops and the pool into one liquid */
.reboot[data-rb="liquid"] .rb-grid, .reboot[data-rb="liquid"] .rb-scan{display:none;}
.reboot[data-rb="liquid"] .rb-art.liq{filter:url(#rbGoo);}
.liq-pool{position:absolute; left:-8%; right:-8%; bottom:-4%; height:calc(var(--p,0) * 68% + 2%); background:var(--acc);
  border-radius:50% 50% 0 0 / 14% 14% 0 0; animation:liqPool 5s ease-in-out infinite alternate;}
@keyframes liqPool{0%{border-radius:52% 48% 0 0 / 12% 16% 0 0;} 100%{border-radius:46% 54% 0 0 / 18% 10% 0 0;}}
.liq-drop{position:absolute; top:-8%; left:var(--x); width:var(--s); height:var(--s); background:var(--acc);
  border-radius:50% 0 50% 50%; transform:rotate(-45deg); animation:liqFall var(--d) cubic-bezier(.45,0,.9,.5) var(--dl) infinite;}
@keyframes liqFall{
  0%{transform:translateY(0) rotate(-45deg); opacity:0;}
  10%{opacity:1;}
  85%{transform:translateY(84vh) rotate(-45deg); opacity:1;}
  100%{transform:translateY(84vh) rotate(-45deg) scale(1.5,.3); opacity:0;}
}
.liq-bub{position:absolute; bottom:0; left:var(--x); width:var(--s); height:var(--s); border-radius:50%; background:var(--acc);
  opacity:0; animation:liqRise var(--d) ease-out var(--dl) infinite;}
@keyframes liqRise{0%{transform:translateY(0) scale(.5); opacity:0;} 20%{opacity:.8;} 100%{transform:translateY(-60vh) scale(1); opacity:0;}}
.reboot[data-rb="liquid"] .rb-main{position:relative; z-index:1; padding:30px 32px; max-width:600px;
  background:rgba(var(--glass-rgb),.55); backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(var(--acc-rgb),.25); border-radius:28px; animation:liqBlob 12s ease-in-out infinite alternate;}
.reboot[data-rb="liquid"] .reboot-fill{background:var(--acc); border-radius:999px; box-shadow:none;}
.reboot[data-rb="liquid"] .rb-main::before{content:''; position:absolute; left:0; right:0; top:-7px; height:12px; pointer-events:none;
  background:var(--acc); -webkit-mask:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='12'><path d='M0 6 Q20 0 40 6 T80 6' fill='none' stroke='%23000' stroke-width='2'/></svg>") repeat-x; mask:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='12'><path d='M0 6 Q20 0 40 6 T80 6' fill='none' stroke='%23000' stroke-width='2'/></svg>") repeat-x;}
.reboot[data-rb="liquid"] .reboot-bar{background:rgba(var(--acc-rgb),.12); border-radius:999px;}

/* ── Geo type: flat geometric look. Polygon shapes, chamfered blocks,
   pattern of broken shapes as background. Dark and light variants
   come from the palette (Geo-Dark / Geo-Light). ── */
body[data-style="geo"]{
}
body[data-style="geo"] .bg-wrap{background:var(--bg) !important;}
body[data-style="geo"] .blob,
body[data-style="geo"] .grid-overlay,
body[data-style="geo"] .scanline,
body[data-style="geo"] .particles{display:none !important;}

body[data-style="geo"] .wordmark g{color:var(--text) !important;}
body[data-style="geo"] .card{
  background:color-mix(in srgb, var(--bg2) 72%, transparent); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  border:0; border-radius:0; box-shadow:none; padding:18px 20px;

  animation:cardIn .5s both;
}
body[data-style="geo"] .card:nth-of-type(even){
  clip-path:polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
}
body[data-style="geo"] .card-title{color:var(--muted); font-weight:700; letter-spacing:.3px;}
body[data-style="geo"] .card-title .bar{width:10px; height:10px; border-radius:0; box-shadow:none; animation:none;
  background:#E63946; clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%);}
body[data-style="geo"] .card:nth-of-type(4n+2) .card-title .bar{background:#1D4ED8;}
body[data-style="geo"] .card:nth-of-type(4n+3) .card-title .bar{background:#22A55A;}
body[data-style="geo"] .card:nth-of-type(4n+4) .card-title .bar{background:#FFC300;}
body[data-style="geo"] .btn{
  border:0; border-radius:0; background:var(--bg3); color:var(--text); box-shadow:none;
  backdrop-filter:none; animation:none;
  clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}
body[data-style="geo"] .btn::before{display:none;}
body[data-style="geo"] .btn:hover{background:var(--acc); color:var(--bg); box-shadow:none;}
body[data-style="geo"] .btn.primary,
body[data-style="geo"] .btn.open,
body[data-style="geo"] .btn.playing{background:var(--acc); color:#111; animation:none; box-shadow:none;}
body[data-style="geo"] .btn.primary:hover,
body[data-style="geo"] .btn.open:hover{background:var(--text); color:var(--bg); filter:none; transform:none;}
body[data-style="geo"] .btn.textlink{background:transparent; clip-path:none; color:var(--muted);}
body[data-style="geo"] .btn.textlink:hover{background:transparent; color:var(--text);}

/* ── Geo background: corner clusters of shapes, parallax with delay ── */
.geo-field{position:absolute; top:0; left:0; right:0; pointer-events:none; display:none; will-change:transform;}
body[data-style="geo"] .geo-field{display:block;}
.geo-s{position:absolute; will-change:transform;}
.geo-s svg{width:100%; height:100%; display:block; overflow:visible;
  animation:geoFloat var(--dur) ease-in-out var(--del) infinite alternate;}
@keyframes geoFloat{from{transform:rotate(var(--r0)) translate(0,0);} to{transform:rotate(var(--r1)) translate(var(--dx),var(--dy));}}

body[data-style="geo"] #statusbar{
  background:color-mix(in srgb, var(--bg2) 80%, transparent); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  border-top:0; clip-path:polygon(16px 0, 100% 0, 100% 100%, 0 100%, 0 16px); padding:10px 22px 10px 26px;
}
body[data-style="geo"] #statusbar::before{content:''; position:absolute; left:0; top:0; width:16px; height:16px; background:var(--acc); clip-path:polygon(0 0,100% 0,0 100%);}
body[data-style="geo"] #statusbar::after{content:''; position:absolute; left:0; right:0; top:0; height:3px;
  background:linear-gradient(90deg,#FF3333 0 25%,#FFDD5C 25% 50%,#38B6FF 50% 75%,#00BE63 75%);}

body[data-style="geo"] .dropzone{border-radius:0;}
body[data-style="geo"] .dropzone.drag{border-style:solid; border-color:#00BE63; color:#00BE63; background:rgba(0,190,99,0.16); box-shadow:none; transform:scale(1.03);}
body[data-style="geo"] .dropzone.bad{border-style:solid; border-color:#FF3333; color:#FF3333; box-shadow:none;
  background:repeating-linear-gradient(45deg, rgba(255,51,51,0.22) 0 8px, transparent 8px 16px);}

/* ── Liquid type: shader noise background (WebGL), soft liquid panels with wavy edges ── */
#liquidBg{display:none; position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
body[data-style="liquid"] #liquidBg{display:block;}
body[data-style="liquid"] .bg-wrap{background:var(--bg) !important;}
body[data-style="liquid"] .bg-wrap>*:not(#liquidBg){display:none !important;}
body[data-style="liquid"] .wordmark{color:var(--text); filter:none; animation:none;}
body[data-style="liquid"] .wordmark g{color:var(--text) !important;}
body[data-style="liquid"] .card{
  position:relative; background:color-mix(in srgb, var(--bg2) 55%, transparent);
  backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
  border:1px solid rgba(var(--acc-rgb),0.18); box-shadow:none;
  animation:cardIn .5s both, liqBlob 18s ease-in-out infinite alternate;
}
body[data-style="liquid"] .card::before{

  background:var(--acc); -webkit-mask:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='12'><path d='M0 6 Q20 0 40 6 T80 6' fill='none' stroke='%23000' stroke-width='2' stroke-opacity='.85'/></svg>") repeat-x; mask:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='12'><path d='M0 6 Q20 0 40 6 T80 6' fill='none' stroke='%23000' stroke-width='2' stroke-opacity='.85'/></svg>") repeat-x; -webkit-mask-size:80px 12px; mask-size:80px 12px; animation:liqWave 3.2s linear infinite;
}
body[data-style="liquid"] .btn{
  border-radius:999px; background:rgba(var(--acc-rgb),0.08); border:1px solid rgba(var(--acc-rgb),0.25);
  color:var(--text); box-shadow:none; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); animation:none;
}
body[data-style="liquid"] .btn::before{display:none;}
body[data-style="liquid"] .btn.primary,
body[data-style="liquid"] .btn.open,
body[data-style="liquid"] .btn.playing{background:var(--acc); color:#111418; border-color:transparent; box-shadow:0 0 18px rgba(var(--acc-rgb),0.35);}
body[data-style="liquid"] .app{padding-bottom:112px;}
/* status bar: a separate floating capsule (own layer, own colour, warm rim) so it never melts into the cards */
body[data-style="liquid"] #statusbar{
  left:20px; right:20px; bottom:14px; max-width:860px; margin:0 auto;
  display:flex; align-items:center; gap:11px; min-height:42px; padding:11px 22px 11px 20px;
  border-radius:21px; border:1px solid rgba(var(--acc-rgb),0.30);

body[data-style="liquid"] #statusbar::before{

@keyframes sbDot{0%,100%{opacity:.65; transform:scale(.9);} 50%{opacity:1; transform:scale(1.15);}}
/* dark liquid glass: the blocks themselves are painted by the shader (see script), the DOM only carries the content */

  border-radius:20px; padding:18px 22px; animation:cardIn .5s both;
}
body.liq-gl[data-style="liquid"] .card::before{display:none;}
body.liq-gl[data-style="liquid"] #statusbar{background:rgba(10,11,13,0.50); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:0; box-shadow:none;}
/* white variant: same liquid glass, light palette */
body[data-tone="light"][data-style="liquid"] .btn{background:rgba(255,255,255,0.55); border-color:rgba(var(--acc-rgb),0.38);}
body[data-tone="light"][data-style="liquid"] .btn.primary,
body[data-tone="light"][data-style="liquid"] .btn.open,
body[data-tone="light"][data-style="liquid"] .btn.playing{background:var(--acc); border-color:transparent; box-shadow:0 4px 14px rgba(var(--acc-rgb),0.35);}
body[data-tone="light"][data-style="liquid"] #lblPos,
body[data-tone="light"][data-style="liquid"] #snapVal,
body[data-tone="light"][data-style="liquid"] .panhead .val{text-shadow:none;}
body[data-tone="light"][data-style="liquid"] .knobhead .val,
body[data-tone="light"][data-style="liquid"] .eqcell .val{filter:brightness(.68) saturate(1.25); text-shadow:none !important;}
body[data-tone="light"][data-style="liquid"] .slot.selected{background:var(--acc); color:#111418;}
body[data-tone="light"][data-style="liquid"] #statusbar{color:var(--text); background:rgba(255,255,255,0.55); border-color:rgba(var(--acc-rgb),0.40); box-shadow:0 10px 26px rgba(0,0,0,.12), 0 0 18px rgba(var(--acc-rgb),.12);}
body[data-tone="light"][data-style="liquid"] #statusbar.pulse{color:var(--text); text-shadow:none;}
body.liq-gl[data-tone="light"][data-style="liquid"] #statusbar{background:rgba(255,255,255,0.22); border:0; box-shadow:none;}
@keyframes liqBlob{0%{border-radius:26px 34px 28px 38px / 32px 24px 38px 28px;} 100%{border-radius:38px 26px 34px 24px / 26px 36px 24px 36px;}}
@keyframes liqWave{to{background-position:80px 0;}}

/* ── Paper type: warm sheet of paper, serif type, thin rules, ink-stamp buttons, no glow, no blur ── */
body[data-style="paper"]{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif; background:var(--bg);}
body[data-style="paper"] .bg-wrap{background-color:var(--bg) !important;
  background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.018) 0 1px, transparent 1px 3px) !important;}
body[data-style="paper"] .blob, body[data-style="paper"] .grid-overlay,
body[data-style="paper"] .scanline, body[data-style="paper"] .particles{display:none !important;}
body[data-style="paper"] .wordmark{color:var(--text); filter:none; animation:none;}
body[data-style="paper"] .wordmark g{color:var(--text) !important;}
body[data-style="paper"] .filename{font-style:italic; letter-spacing:.02em;}
body[data-style="paper"] .card{
  background:var(--glass); backdrop-filter:none; -webkit-backdrop-filter:none;
  border:1px solid color-mix(in srgb, var(--text) 14%, transparent); border-radius:3px;
  box-shadow:6px 6px 0 -1px var(--bg3), 6px 6px 0 0 color-mix(in srgb, var(--text) 10%, transparent);
  padding:20px 22px; animation:cardIn .5s both;
}
body[data-style="paper"] .card-title{color:var(--muted); font-family:inherit; font-size:11px; font-weight:700;
  letter-spacing:.2em; text-transform:uppercase;}
body[data-style="paper"] .card-title .bar{width:18px; height:1px; border-radius:0; background:var(--text); box-shadow:none; animation:none;}
body[data-style="paper"] .btn{
  background:transparent; border:1px solid color-mix(in srgb, var(--text) 32%, transparent); border-radius:2px;
  color:var(--text); font-family:inherit; font-style:italic; font-weight:400; box-shadow:none; backdrop-filter:none; animation:none;}
body[data-style="paper"] .btn::before{display:none;}
body[data-style="paper"] .btn:hover{background:var(--bg3); border-color:var(--text); box-shadow:none;}
body[data-style="paper"] .btn:active{transform:translateY(1px);}
body[data-style="paper"] .btn.primary, body[data-style="paper"] .btn.open, body[data-style="paper"] .btn.playing{
  background:var(--acc); color:var(--bg); border-color:var(--acc); box-shadow:none; animation:none; font-style:normal; font-weight:700;}
body[data-style="paper"] .btn.primary:hover, body[data-style="paper"] .btn.open:hover{background:var(--acc-hot); border-color:var(--acc-hot); filter:none;}
body[data-style="paper"] .btn.textlink{border-color:transparent; background:transparent; color:var(--muted);}
body[data-style="paper"] .btn.textlink:hover{background:transparent; color:var(--acc);}
body[data-style="paper"] #statusbar{
  background:var(--glass); backdrop-filter:none; -webkit-backdrop-filter:none; border:0; border-top:2px solid var(--acc);
  border-radius:0; box-shadow:0 -6px 18px rgba(0,0,0,.06); font-style:italic; color:var(--text);}
body[data-style="paper"] #statusbar::before{display:none;}
body[data-style="paper"] .settings-panel{background:var(--glass); border:1px solid color-mix(in srgb, var(--text) 14%, transparent); border-radius:3px; box-shadow:10px 10px 0 -1px var(--bg3);}
/* ── Paper refinement: no glows, editorial hairlines, typewriter figures ── */
body[data-style="paper"]{--rule:color-mix(in srgb, var(--text) 16%, transparent);}
body[data-style="paper"] *{text-shadow:none !important;}
body[data-style="paper"] header{border-bottom:1px solid var(--rule); margin-bottom:16px; padding-bottom:14px;}
body[data-style="paper"] .card{box-shadow:4px 4px 0 0 var(--bg3);}
body[data-style="paper"] .card-title{display:flex; align-items:center; gap:10px;}
body[data-style="paper"] .card-title::after{content:''; flex:1; height:1px; background:var(--rule);}

body[data-style="paper"] #lblPos, body[data-style="paper"] #snapVal, body[data-style="paper"] #lblDur,
body[data-style="paper"] .panhead .val, body[data-style="paper"] .knobhead .val, body[data-style="paper"] .eqcell .val{
  font-family:'Consolas','SFMono-Regular',ui-monospace,monospace !important; color:var(--text) !important; font-weight:600;}
body[data-style="paper"] .panhead .nm, body[data-style="paper"] .knobhead .nm, body[data-style="paper"] .field label,
body[data-style="paper"] .settings-row label, body[data-style="paper"] .snaprow .snaplbl{font-family:inherit; letter-spacing:.14em; text-transform:uppercase; font-size:10px;}

body[data-style="paper"] #lblBadge{background:var(--text); color:var(--bg); font-family:inherit; letter-spacing:.12em; text-transform:uppercase; border-radius:2px; padding:3px 7px;}
body[data-style="paper"] .slot{background:transparent; border:1px solid var(--rule); border-radius:2px; box-shadow:none;}
body[data-style="paper"] .slot:hover{transform:none; box-shadow:none; background:var(--bg3); border-color:var(--text);}
body[data-style="paper"] .slot.occupied{border-color:var(--text);}
body[data-style="paper"] .slot.selected{background:var(--text); color:var(--bg); border-color:var(--text);}
body[data-style="paper"] .lang-option.selected{background:var(--text); color:var(--bg);}
body[data-style="paper"] .lang-option:hover{background:var(--bg3); color:var(--text);}
body[data-style="paper"] .lang-options{box-shadow:6px 6px 0 -1px var(--bg3); border-radius:3px;}
body[data-style="paper"] .lang-select-btn{background:transparent; border:1px solid var(--rule); border-radius:2px; box-shadow:none;}
body[data-style="paper"] .lang-select-btn:hover, body[data-style="paper"] .lang-select-btn[aria-expanded="true"]{border-color:var(--text); box-shadow:none; background:transparent;}

body[data-style="paper"] .knobcell, body[data-style="paper"] .eqcell{background:transparent; border:1px solid var(--rule); border-radius:2px; box-shadow:none;}
body[data-style="paper"] .knobcell:hover, body[data-style="paper"] .eqcell:hover{border-color:var(--text); box-shadow:none; background:var(--bg3);}
body[data-style="paper"] .sensi:hover{background:transparent;}
body[data-style="paper"] .sensi-dot.lit{box-shadow:none !important;}
body[data-style="paper"] .transport{border-top:1px solid var(--rule);}
body[data-style="paper"] .dropzone{background:transparent; border:1px dashed color-mix(in srgb, var(--text) 30%, transparent); border-radius:2px; box-shadow:none;}
body[data-style="paper"] .dropzone:hover, body[data-style="paper"] .dropzone.drag{border-color:var(--text); background:var(--bg3); box-shadow:none;}

body[data-style="paper"] #prog{background:transparent; border:0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); border-radius:0; height:56px;}
body[data-style="paper"] #vu{border-radius:0; height:6px; background:var(--bg3);}
body[data-style="paper"] .playwrap::after{display:none;}

body[data-style="paper"] .field input[type=text], body[data-style="paper"] #profName, body[data-style="paper"] .settings-row select{
  background:transparent; border:0; border-bottom:1px solid var(--rule); border-radius:0; box-shadow:none; color:var(--text);}
body[data-style="paper"] .field input[type=text]:focus, body[data-style="paper"] #profName:focus, body[data-style="paper"] .settings-row select:focus{
  border-bottom-color:var(--text); box-shadow:none; outline:none;}

body[data-style="paper"] .switch{border-radius:2px; border:1px solid var(--text); background:transparent;}
body[data-style="paper"] .switch .knob{border-radius:1px; background:var(--text);}
body[data-style="paper"] .switch.on{background:var(--acc); border-color:var(--acc);}
body[data-style="paper"] .switch.on .knob{background:var(--bg);}
body[data-style="paper"] .tipbtn:hover, body[data-style="paper"] .tipbtn.active{box-shadow:none;}
body[data-style="paper"] #btnMute.muted{color:#A4382A; border-color:#A4382A; box-shadow:none; background:transparent;}
body[data-style="paper"] #statusbar.pulse{color:var(--text);}
body[data-style="paper"] .settings-panel h2 .bar{box-shadow:none;}
body[data-style="paper"] .settings-panel h2{font-family:inherit; font-weight:700; letter-spacing:.02em;}

/* ── Paper v2: regular UI font, roomier page margins, deeper sheets ── */
body[data-style="paper"], body[data-style="paper"] .btn, body[data-style="paper"] input,
body[data-style="paper"] select, body[data-style="paper"] #statusbar, body[data-style="paper"] .filename{
  font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif !important; font-style:normal !important;}
body[data-style="paper"] .btn{font-weight:600;}
body[data-style="paper"] #lblPos, body[data-style="paper"] #snapVal, body[data-style="paper"] #lblDur,
body[data-style="paper"] .panhead .val, body[data-style="paper"] .knobhead .val, body[data-style="paper"] .eqcell .val{
  font-variant-numeric:tabular-nums; font-weight:700;}
body[data-style="paper"] .panhead .nm, body[data-style="paper"] .knobhead .nm, body[data-style="paper"] .field label,
body[data-style="paper"] .settings-row label, body[data-style="paper"] .snaprow .snaplbl{
  text-transform:none; letter-spacing:.02em; font-size:11px;}
body[data-style="paper"] #lblBadge{text-transform:none; letter-spacing:.02em; font-size:11px;}

/* page margins: wider sheet, more air around it */
body[data-style="paper"] .bg-wrap{background-color:var(--bg) !important;
  background-image:radial-gradient(circle, color-mix(in srgb, var(--text) 9%, transparent) 1px, transparent 1.5px) !important;
  background-size:24px 24px !important;}
body[data-style="paper"] .app{max-width:1080px; padding:64px 64px 140px;}
body[data-style="paper"] header{margin-bottom:28px; padding-bottom:20px;}

/* sheets: bigger, layered paper shadow, slight lift on hover */
body[data-style="paper"] .card{
  padding:32px 36px; margin-bottom:30px; border-radius:4px;
  background:var(--glass);
  border:1px solid color-mix(in srgb, var(--text) 10%, transparent);
  box-shadow:0 1px 1px rgba(0,0,0,.04), 0 6px 14px -6px rgba(0,0,0,.14), 10px 12px 0 -1px var(--bg3), 10px 12px 0 0 var(--rule);
  transition:transform .25s ease, box-shadow .25s ease;}
body[data-style="paper"] .card:hover{transform:translateY(-2px);
  box-shadow:0 1px 1px rgba(0,0,0,.04), 0 12px 24px -10px rgba(0,0,0,.2), 12px 14px 0 -1px var(--bg3), 12px 14px 0 0 var(--rule);}
body[data-style="paper"] .card-title{font-size:12px; margin-bottom:22px;}
body[data-style="paper"] .transport{padding-top:20px; margin-top:20px;}

@media (max-width:640px){
  body[data-style="paper"] .app{padding:28px 16px 110px;}
  body[data-style="paper"] .card{padding:22px 20px;}
}

/* ── Paper v3: ruled notebook sheet instead of dots ── */
body[data-style="paper"] .bg-wrap{background-color:var(--bg) !important;
  background-image:repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--acc) 20%, transparent) 31px 32px) !important;
  background-size:100% 32px !important;}
body[data-style="paper"] .bg-wrap::after{content:''; position:absolute; top:0; bottom:0;
  left:calc(50% - 540px + 22px); width:1.5px; background:color-mix(in srgb, var(--acc2) 45%, transparent);}
@media (max-width:1120px){
  body[data-style="paper"] .bg-wrap::after{left:22px;}
}

/* ── Paper v4: solid sheets + drifting ruled paper ── */
/* --glass was never defined (theme only sets --glass-rgb), so every var(--glass) fell back to transparent */
body[data-style="paper"]{--glass:rgb(var(--glass-rgb));}
body[data-style="paper"] .card{background:var(--glass) !important;}
body[data-style="paper"] #statusbar{background:var(--glass) !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important;}
body[data-style="paper"] .settings-panel{background:var(--glass) !important;}
body[data-style="paper"] .lang-options{background:var(--glass) !important;}

body[data-style="paper"] .bg-wrap{animation:paperDrift 18s linear infinite;}
@keyframes paperDrift{from{background-position:0 0;} to{background-position:0 32px;}}

/* ── Paper v5: no idle motion, no decorative rules, scroll-linked paper ── */
body[data-style="paper"] .bg-wrap{animation:none !important;}
body[data-style="paper"] header{border-bottom:0 !important; margin-bottom:22px; padding-bottom:0;}
/* logo restored */
body[data-style="paper"] .card-title::after{display:none;}
body[data-style="paper"] .transport{border-top:0 !important; padding-top:0 !important;}

</style>

/* ── neon palette + tint helper ──────────────────────────────── */
let ACC = '#3cffd0', ACC2 = '#3cffd0';
function blend(c1, c2, t){
  const p = (h)=>[parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const [r1,g1,b1] = p(c1), [r2,g2,b2] = p(c2);
  const r = Math.round(r1+(r2-r1)*t), g = Math.round(g1+(g2-g1)*t), b = Math.round(b1+(b2-b1)*t);
  return `#${[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('')}`;
}
let COL = {
  bg2:'#102422', bg3:'#17312f', dim:'#17312f', text:'#f2fffb', muted:'#75a096',
  acc:ACC, acc_hot: blend(ACC,'#ffffff',0.55), acc_dim: blend(ACC,'#000000',0.35)
};

ентру (обидві колонки звучать однаково). Тягніть до L або R, щоб віддати більше звуку в той бік.", "loopRegionTitle": "Ділянка повтору", "end": "Кінець", "setLoop": "Задати повтор", "clear": "Очистити", "controlsTitle": "Керування", "snap": "Крок", "resetControls": "Скинути регулятори", "equalizerTitle": "Еквалайзер (±12 дБ)", "resetEq": "Скинути EQ", "profilesTitle": "Профілі", "showMoreSlots": "Показати більше слотів", "showFewerSlots": "Показати менше слотів", "nameLabel": "Ім'я", "profNamePlaceholder": "ім'я активного слота", "statusDefault": "Файл не завантажено · натисніть «Відкрити файл»", "offLabel": "ВИМК", "knobVol": "Гучн.", "knobVolTip": "Гучність відтворення. 100% — початковий рівень запису. Більше — гучніше, але після ~150% звук може втрачати чистоту.", "knobSpeed": "Швидк.", "knobSpeedTip": "Швидкість відтворення. 100% — початковий темп. Більше — швидше й вище тоном, менше — повільніше й нижче (як у програвача платівок).", "knobPitch": "Тон", "knobPitchTip": "Висота тону в півтонах, незалежно від швидкості. 0 — оригінал. +12 — на октаву вище, -12 — на октаву нижче.", "knobReverb": "Реверб", "knobReverbTip": "Реверберація — додає відчуття простору/кімнати навколо звуку. 0% — сухий звук, більше значення — більше «луни».", "knobDrive": "Драйв", "knobDriveTip": "Перевантаження (спотворення) — навмисно робить звук грубішим і «злішим». 0% — чистий звук без спотворень.", "knobComp": "Комп.", "knobCompTip": "Компресор — піднімає тихі місця та стримує надто гучні, вирівнюючи гучність треку. 0% — без обробки.", "eqBassTip": "Низькі частоти. Додайте (+) — звук стане густішим і глибшим (бубонявим); зменшіть (-) — менше «гупання» від баса й бас-бочки.", "eqLowMidTip": "Низька середина. Відповідає за «тіло» й теплоту звуку. Забагато — звук стає «брудним», каламутним.", "eqMidTip": "Середина. Тут міститься більшість вокалу та інструментів. Додайте для щільнішого, «пробивнішого» звуку; зменшіть — для м'якшого.", "eqHighMidTip": "Верхня середина. Відповідає за чіткіст or del sonido. 0% es un sonido seco; más alto añade más «eco».", "knobDrive": "Drive", "knobDriveTip": "Overdrive (distorsión) — hace el sonido deliberadamente más áspero y «sucio». 0% es un sonido limpio sin distorsión.", "knobComp": "Comp", "knobCompTip": "Compresor — realza las partes bajas y contiene las demasiado altas, nivelando el volumen de la pista. 0% significa sin procesamiento.", "eqBassTip": "Graves. Sube (+) y el sonido se vuelve más grueso y profundo (retumbante); baja (-) para menos «golpe» de bombo y bajo.", "eqLowMidTip": "Medios bajos. Responsables del «cuerpo» y la calidez del sonido. Demasiado aquí y el sonido se vuelve «turbio» o sucio.", "eqMidTip": "Medios. Aquí se ubican la mayoría de la voz y los instrumentos. Sube para un sonido más presente y «contundente»; baja para algo más suave.", "eqHighMidTip": "Medios altos. Responsables de la claridad y «presencia» (inteligibilidad vocal, ataque de los instrumentos). Demasiado causa aspereza y fatiga auditiva.", "eqTrebleTip": "Agudos. Añade «aire» y brillo (platillos, detalle de siseo). Demasiado y aparece un siseo desagradable.", "statusControlsReset": "Controles restablecidos", "statusEqReset": "EQ restablecido", "statusSlotCleared": "Ranura {n} borrada", "statusLoading": "Cargando…", "statusSlotSelectedNamed": "Ranura {n} seleccionada · «{name}»", "statusSlotSelectedEmpty": "Ranura {n} seleccionada · vacía", "statusLoadedProfile": "Cargado «{profile}»  ({file})", "statusSavingFile": "Guardando «{name}»…", "statusErrorPrefix": "Error: {msg}", "statusSavedFile": "Guardado «{name}»  ({duration})", "statusMuted": "Silenciado", "statusUnmuted": "Sonido activado", "statusSensitivity": "Sensibilidad al ritmo: {level}", "sensLow": "sutil", "sensMed": "media", "sensHigh": "fuerte", "statusLoopSet": "Bucle: {start} → {end}", "statusLoopCleared": "Bucle borrado", "badgeLoop": "Bucle {start} – {end}", "dropErrorRead": "No se pudo leer el archivo soltado.", "dropErrorFormat": "Formato no compatible: .{ext}
